<script>
  const screenAdd = document.getElementById("screen-add");
  const screenOCR = document.getElementById("screen-ocr");
  const screenResults = document.getElementById("screen-results");
  const imageInput = document.getElementById("imageInput");
  const ocrBg = document.getElementById("ocr-bg");
  const ocrProgress = document.getElementById("ocr-progress");
  const searchInput = document.getElementById("searchInput");
  const autosuggestEl = document.getElementById("autosuggest");
  const catalogingOverlay = document.getElementById("cataloging-overlay");
  const catalogingStatus = document.getElementById("cataloging-status");
  const catalogingEta = document.getElementById("cataloging-eta");
  const catalogStats = document.getElementById("catalog-stats");
  const searchCatalogStats = document.getElementById("search-catalog-stats");
  const catalogingBar = document.getElementById("cataloging-bar");

  const resultsImage = document.getElementById("results-image");
  const recognizedTitleWrap = document.getElementById("recognized-title-wrap");
  const recognizedTitle = document.getElementById("recognized-title");
  const btnNewImage = document.getElementById("btn-new-image");
  const btnNewSearch = document.getElementById("new-search-btn");
  const pillLeft = document.getElementById("pill-left");
  const pillRight = document.getElementById("pill-right");
  const pillMainLabel = document.getElementById("pill-main-label");
  const pillBadge = document.getElementById("pill-badge");
  const resultsImageInner = document.getElementById("results-image-inner");
  const highlightsLayer = document.getElementById("highlightsLayer");

  const scanWordEl = document.getElementById("scan-word");
  const scanAngleEl = document.getElementById("scan-angle");
  const scanGradient = document.getElementById("scan-gradient");
  const scanBand = document.getElementById("scan-band");
  const scanWordOverlay = document.getElementById("scan-word-overlay");

  const hitPrevBtn = document.getElementById("hit-prev");
  const hitNextBtn = document.getElementById("hit-next");
  const hitPrevInline = document.getElementById("hit-prev-inline");
  const hitNextInline = document.getElementById("hit-next-inline");

  const termModal = document.getElementById("term-modal");
  const termModalBackdrop = document.getElementById("term-modal-backdrop");
  const termModalClose = document.getElementById("term-modal-close");
  const termModalCanvas = document.getElementById("term-modal-canvas");
  const termModalConfidence = document.getElementById("term-modal-confidence");

  const bookModal = document.getElementById("book-modal");
  const bookModalBackdrop = document.getElementById("book-modal-backdrop");
  const bookModalClose = document.getElementById("book-modal-close");
  const bookModalCover = document.getElementById("book-modal-cover");
  const bookModalNoCover = document.getElementById("book-modal-no-cover");
  const bookModalTitle = document.getElementById("book-modal-title");
  const bookModalAuthor = document.getElementById("book-modal-author");
  const bookModalMeta = document.getElementById("book-modal-meta");

  let ocrWords = [];
  let imageDataUrl = "";
  let sourceCanvas = null; // normalized, color-correct source used for display + bbox coord space
  let sourceDataUrl = "";

  let termList = [];
  let currentTermIndex = -1;
  let currentTerm = "";

  let currentMatches = [];
  let currentMatchIndex = 0;

  // AI-assisted book recognition test.
  // After deploying the Supabase Edge Function included with this build, paste its URL here.
  // Example: https://YOUR_PROJECT.supabase.co/functions/v1/identify-book
  const BOOK_ID_ENDPOINT = "https://npjiuowtneivxbgskobd.supabase.co/functions/v1/identify-book";
  const BOOK_ID_ENABLED = !BOOK_ID_ENDPOINT.includes("YOUR_SUPABASE_FUNCTION_URL");
  const bookRecognitionCache = new Map();
  let recognitionRequestSerial = 0;
  let bookCatalog = [];
  let aiSpineWords = [];
  const catalogTerms = new Set();
  let catalogingRunSerial = 0;
  let catalogingActive = false;

  // Dictionary + whitelist sets
  let DICT = null;
  let WHITELIST = null;
  let dictLoaded = false;
  let whitelistLoaded = false;

  const SHORT_COMMON_WORDS = new Set([
    "a","an","as","at","be","by","do","go","he","if","in","is","it","me","my",
    "no","of","on","or","so","to","up","us","we"
  ]);

  function showScreen(el) {
    [screenAdd, screenOCR, screenResults].forEach((s) => s.classList.remove("active"));
    el.classList.add("active");
  }

  async function loadWordLists() {
    try {
      const dictResp = await fetch("dictionary.json");
      if (dictResp.ok) {
        const dictData = await dictResp.json();
        DICT = new Set((dictData || []).map(w => String(w).toLowerCase()));
        dictLoaded = true;
      }
    } catch (e) {
      console.warn("dictionary.json could not be loaded:", e);
    }

    try {
      const wlResp = await fetch("whitelist.json");
      if (wlResp.ok) {
        const wlData = await wlResp.json();
        WHITELIST = new Set((wlData || []).map(w => String(w).toLowerCase()));
        whitelistLoaded = true;
      }
    } catch (e) {
      console.warn("whitelist.json could not be loaded:", e);
    }
  }

  function isCarouselWord(word) {
    if (!word) return false;
    const w = word.toLowerCase();

    if (catalogTerms.has(w)) return true;

    if ((dictLoaded && DICT && DICT.has(w)) ||
        (whitelistLoaded && WHITELIST && WHITELIST.has(w))) {
      return true;
    }

    if (!dictLoaded && !whitelistLoaded) {
      if (SHORT_COMMON_WORDS.has(w)) return true;
      if (!/^[a-z]+$/.test(w)) return false;
      if (w.length < 3) return false;
      if (!/[aeiouy]/.test(w)) return false;
      return true;
    }
    return false;
  }

  function findPrevDictIndex(startIndex) {
    if (!termList.length) return -1;
    let idx = startIndex;
    for (let steps = 0; steps < termList.length; steps++) {
      idx = (idx - 1 + termList.length) % termList.length;
      if (isCarouselWord(termList[idx])) return idx;
    }
    return -1;
  }

  function findNextDictIndex(startIndex) {
    if (!termList.length) return -1;
    let idx = startIndex;
    for (let steps = 0; steps < termList.length; steps++) {
      idx = (idx + 1) % termList.length;
      if (isCarouselWord(termList[idx])) return idx;
    }
    return -1;
  }

  // *** FIXED MAPPING FUNCTION ***
  function mapBboxToOriginal(bbox, kind, W, H) {
    let { x0, y0, x1, y1 } = bbox;

    const corners = [
      [x0, y0], [x1, y0], [x1, y1], [x0, y1],
    ];

    function fromBase(u, v) { return { x: u, y: v }; }
    function fromCW(u, v) { return { x: v, y: H - u }; }   // rotated -> original (CW)
    function fromCCW(u, v) { return { x: W - v, y: u }; }  // rotated -> original (CCW)

    const mapped = corners.map(([u, v]) => {
      if (kind === "base") return fromBase(u, v);
      if (kind === "cw")   return fromCW(u, v);
      return fromCCW(u, v);
    });

    const xs = mapped.map(p => p.x);
    const ys = mapped.map(p => p.y);

    let nx0 = Math.min(...xs), ny0 = Math.min(...ys);
    let nx1 = Math.max(...xs), ny1 = Math.max(...ys);

    nx0 = Math.max(0, Math.min(W, nx0));
    nx1 = Math.max(0, Math.min(W, nx1));
    ny0 = Math.max(0, Math.min(H, ny0));
    ny1 = Math.max(0, Math.min(H, ny1));

    return { x0: nx0, y0: ny0, x1: nx1, y1: ny1 };
  }

  /* ==========================
     SCANNING WORD PULSES
     ========================== */

  let scanPulseTimer = null;
  let scanPulseActive = false;
  let scanPulsePool = [];
  let scanPulseDims = { W: 0, H: 0 };

  function clearScanWordOverlay() {
    if (!scanWordOverlay) return;
    while (scanWordOverlay.firstChild) scanWordOverlay.removeChild(scanWordOverlay.firstChild);
  }

  function sanitizePulseText(raw) {
    const clean = String(raw || "")
      .trim()
      .replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "")
      .trim();
    if (!clean) return "";
    if (clean.length < 3) return "";
    if (clean.length > 18) return "";
    if (!/^[a-z0-9]+$/i.test(clean)) return "";
    return clean.toLowerCase();
  }

  function showFloatingWord(wordObj) {
    if (!scanWordOverlay) return;
    if (!wordObj || !wordObj.text || !wordObj.bbox) return;
    if (!screenOCR.classList.contains("active")) return;
    if (screenOCR.classList.contains("mode-search")) return;

    const text = sanitizePulseText(wordObj.text);
    if (!text) return;

    const { W, H } = scanPulseDims;
    if (!W || !H) return;

    const bbox = wordObj.bbox;
    const cx = ((bbox.x0 + bbox.x1) / 2) / W;
    const cy = ((bbox.y0 + bbox.y1) / 2) / H;

    const px = Math.max(0.06, Math.min(0.94, cx)) * 100;
    const py = Math.max(0.10, Math.min(0.90, cy)) * 100;

    const el = document.createElement("div");
    el.className = "scan-float-word";
    el.textContent = text;

    // font size scales a bit with word length
    const len = text.length;
    const vh = Math.max(9, Math.min(16, 14 + (10 - Math.min(len, 10)) * 0.6));
    el.style.fontSize = `min(${vh}vh, 96px)`;

    el.style.left = `${px}%`;
    el.style.top  = `${py}%`;

    scanWordOverlay.appendChild(el);
    setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }

  function pickPulseCandidate() {
    if (!scanPulsePool.length) return null;

    // random tries for a solid candidate
    for (let tries = 0; tries < 14; tries++) {
      const w = scanPulsePool[(Math.random() * scanPulsePool.length) | 0];
      if (!w || !w.text) continue;
      if (typeof w.confidence === "number" && w.confidence < 35) continue;
      if (!sanitizePulseText(w.text)) continue;
      return w;
    }
    return scanPulsePool[(Math.random() * scanPulsePool.length) | 0] || null;
  }

  function scheduleNextPulse() {
    if (!scanPulseActive) return;

    // SHORTER interval so it’s visible even on fast devices
    const delay = 600 + Math.random() * 800; // 0.6s – 1.4s

    scanPulseTimer = setTimeout(() => {
      if (!scanPulseActive) return;
      if (screenOCR.classList.contains("mode-search")) return;

      const candidate = pickPulseCandidate();
      if (candidate) showFloatingWord(candidate);

      scheduleNextPulse();
    }, delay);
  }

  function startScanPulses(W, H) {
    stopScanPulses();
    scanPulseActive = true;
    scanPulsePool = [];
    scanPulseDims = { W, H };
    clearScanWordOverlay();

    // kick one early (it’ll no-op until pool has words)
    scheduleNextPulse();
  }

  function stopScanPulses() {
    scanPulseActive = false;
    if (scanPulseTimer) {
      clearTimeout(scanPulseTimer);
      scanPulseTimer = null;
    }
    clearScanWordOverlay();
    scanPulsePool = [];
  }

  /* ========================== */

  imageInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageDataUrl = ev.target.result;
      startOCR(imageDataUrl);
    };
    reader.readAsDataURL(file);
  });

  function extractCatalogTokens(textValue) {
    return String(textValue || "")
      .toLowerCase()
      .replace(/['’]/g, "")
      .split(/[^a-z0-9]+/g)
      .map(t => t.trim())
      .filter(t => t.length >= 3 && /[a-z]/.test(t));
  }

  function rebuildCatalogTerms() {
    catalogTerms.clear();
    for (const entry of bookCatalog) {
      if (!entry || !entry.result) continue;
      const tokens = [
        ...extractCatalogTokens(entry.result.title),
        ...extractCatalogTokens(entry.result.author)
      ];
      for (const token of tokens) catalogTerms.add(token);
    }
  }

  function buildTermList() {
    const cleaned = ocrWords
      .map(w => (w.text || "").trim())
      .filter(Boolean)
      .map(t => t.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "").trim())
      .filter(t => t.length > 1);

    const aiCleaned = aiSpineWords
      .map(w => normalizeToken(w.text))
      .filter(t => t.length > 1);

    rebuildCatalogTerms();
    termList = Array.from(new Set([...cleaned, ...aiCleaned, ...catalogTerms])).sort((a, b) => a.localeCompare(b));
  }

  function setScanMode(angleLabel, modeClass) {
    screenOCR.classList.add("scanning");
    scanGradient.style.opacity = "1";
    scanGradient.classList.remove("mode-0", "mode-90", "mode-neg90");
    if (modeClass) scanGradient.classList.add(modeClass);

    screenOCR.classList.remove("angle-0", "angle-90", "angle-neg90");
    if (modeClass === "mode-0") screenOCR.classList.add("angle-0");
    else if (modeClass === "mode-90") screenOCR.classList.add("angle-90");
    else if (modeClass === "mode-neg90") screenOCR.classList.add("angle-neg90");

    scanWordEl.textContent = "reading";
    scanAngleEl.textContent = angleLabel;
    updateScanProgress(0);
  }

  function updateScanProgress(progress) {
    const p = Math.max(0, Math.min(1, progress || 0));

    if (scanGradient.classList.contains("mode-0")) {
      scanBand.style.width = "100%";
      scanBand.style.height = (p * 100) + "%";
      scanBand.style.top = "0";
      scanBand.style.left = "0";
      scanBand.style.right = "auto";
    } else if (scanGradient.classList.contains("mode-90")) {
      scanBand.style.height = "100%";
      scanBand.style.width = (p * 100) + "%";
      scanBand.style.left = "0";
      scanBand.style.right = "auto";
    } else if (scanGradient.classList.contains("mode-neg90")) {
      scanBand.style.height = "100%";
      scanBand.style.width = (p * 100) + "%";
      scanBand.style.right = "0";
      scanBand.style.left = "auto";
    }
  }

  function applyGrayscaleAndContrast(canvas, contrastValue = 20) {
    const ctx = canvas.getContext("2d");
    const { width, height } = canvas;
    if (!width || !height) return;

    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;

    const c = contrastValue;
    const factor = (259 * (c + 255)) / (255 * (259 - c));

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      gray = factor * (gray - 128) + 128;
      gray = Math.max(0, Math.min(255, gray));
      data[i] = gray; data[i + 1] = gray; data[i + 2] = gray;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  async function startOCR(dataUrl) {
    showScreen(screenOCR);
    screenOCR.classList.remove("mode-search");
    ocrBg.style.backgroundImage = `url(${dataUrl})`;
    ocrProgress.classList.remove("hidden");
    ocrProgress.textContent = "scanning…";

    ocrWords = [];
    termList = [];
    currentTermIndex = -1;
    currentTerm = "";
    currentMatches = [];
    currentMatchIndex = 0;
    clearHighlights();
    pillMainLabel.textContent = "";
    pillLeft.textContent = "";
    pillRight.textContent = "";
    pillLeft.classList.add("disabled");
    pillRight.classList.add("disabled");
    pillBadge.classList.add("hidden");
    pillBadge.innerHTML = "";
    hitPrevInline.disabled = true;
    hitNextInline.disabled = true;
    hitPrevInline.classList.add("hidden");
    hitNextInline.classList.add("hidden");
    setRecognizedTitle("");
    bookRecognitionCache.clear();
    bookCatalog = [];
    aiSpineWords = [];
    if (catalogStats) catalogStats.classList.remove("visible");
    if (searchCatalogStats) searchCatalogStats.classList.remove("visible");
    recognitionRequestSerial++;
    catalogingRunSerial++;
    catalogingActive = false;
    if (catalogingOverlay) catalogingOverlay.classList.remove("visible");
    if (catalogingBar) catalogingBar.style.width = "0%";

    stopScanPulses();

    try {
      const img = new Image();
      img.src = dataUrl;

      await new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error("Could not load image for OCR"));
      });

      // Normalize into a single, stable pixel coordinate space.
      // We use this same normalized canvas for:
      //  - results display (so what you *see* matches what OCR analyzed)
      //  - bbox coordinates (so mapping never depends on EXIF/canvas quirks)
      const W0 = img.naturalWidth;
      const H0 = img.naturalHeight;

      const MAX_DIM = 2200; // keep OCR fast/stable on mobile
      const scale = Math.min(1, MAX_DIM / Math.max(W0, H0));
      const W = Math.max(1, Math.round(W0 * scale));
      const H = Math.max(1, Math.round(H0 * scale));

      // Source canvas (color) used for display + cropping.
      sourceCanvas = document.createElement("canvas");
      sourceCanvas.width = W;
      sourceCanvas.height = H;
      sourceCanvas.getContext("2d").drawImage(img, 0, 0, W, H);

      // Use the normalized image everywhere in the UI.
      sourceDataUrl = sourceCanvas.toDataURL("image/jpeg", 0.92);
      imageDataUrl = sourceDataUrl;
      ocrBg.style.backgroundImage = `url(${sourceDataUrl})`;

// start pulse loop immediately (words will start once pool fills)
      startScanPulses(W, H);

      const baseCanvas = document.createElement("canvas");
      baseCanvas.width = W;
      baseCanvas.height = H;
      baseCanvas.getContext("2d").drawImage(sourceCanvas, 0, 0);

      const cwCanvas = document.createElement("canvas");
      cwCanvas.width = H;
      cwCanvas.height = W;
      const ctxCW = cwCanvas.getContext("2d");
      ctxCW.translate(H, 0);
      ctxCW.rotate(Math.PI / 2);
      ctxCW.drawImage(sourceCanvas, 0, 0);

      const ccwCanvas = document.createElement("canvas");
      ccwCanvas.width = H;
      ccwCanvas.height = W;
      const ctxCCW = ccwCanvas.getContext("2d");
      ctxCCW.translate(0, W);
      ctxCCW.rotate(-Math.PI / 2);
      ctxCCW.drawImage(sourceCanvas, 0, 0);

      applyGrayscaleAndContrast(baseCanvas, 20);
      applyGrayscaleAndContrast(cwCanvas, 20);
      applyGrayscaleAndContrast(ccwCanvas, 20);

      const passes = [
        { kind: "base", canvas: baseCanvas, label: "0°",   modeClass: "mode-0" },
        { kind: "cw",   canvas: cwCanvas,   label: "90°",  modeClass: "mode-90" },
        { kind: "ccw",  canvas: ccwCanvas,  label: "-90°", modeClass: "mode-neg90" },
      ];

      let allWords = [];

      for (let i = 0; i < passes.length; i++) {
        const { kind, canvas, label, modeClass } = passes[i];
        const passIndex = i + 1;
        const passTotal = passes.length;

        setScanMode(label, modeClass);

        const result = await Tesseract.recognize(canvas, "eng", {
          logger: (m) => {
            if (m.status === "recognizing text") {
              const pct = Math.round((m.progress || 0) * 100);
              ocrProgress.textContent = `reading ${label}  ${passIndex}/${passTotal}… ${pct}%`;
              updateScanProgress(m.progress || 0);
            } else {
              ocrProgress.textContent = `reading ${label}  ${passIndex}/${passTotal}…`;
            }
          },
        });

        updateScanProgress(1);

        const words = result.data.words || [];

        const mapped = words
          .map((w) => {
            if (!w.text || !w.text.trim().length) return null;

            const confidence =
              typeof w.confidence === "number"
                ? w.confidence
                : typeof w.conf === "number"
                ? w.conf
                : null;

            if (typeof confidence === "number" && confidence < 10) return null;

            return {
              text: w.text.trim(),
              bbox: mapBboxToOriginal(w.bbox, kind, W, H),
              confidence,
            };
          })
          .filter(Boolean);

        allWords = allWords.concat(mapped);

        // feed pulse pool as each pass completes (bounded)
        scanPulsePool = scanPulsePool.concat(mapped).slice(-1200);

        // IMPORTANT: guaranteed visible pulse right now (so you see it even if OCR is fast)
        const immediate = pickPulseCandidate();
        if (immediate) showFloatingWord(immediate);
      }

      scanGradient.style.opacity = "0";

      ocrWords = allWords;
      buildTermList();
      ocrProgress.classList.add("hidden");

      // stop pulses once search UI appears
      stopScanPulses();

      await catalogBooks();
      screenOCR.classList.add("mode-search");
      setTimeout(() => searchInput.focus(), 450);
    } catch (err) {
      console.error(err);
      stopScanPulses();
      alert(
        "There was a problem reading the image.\n\n" +
          (err && err.message ? err.message : String(err))
      );
      scanGradient.style.opacity = "0";
      showScreen(screenAdd);
    }
  }

  function updateAutosuggest(query) {
    const trimmed = query.trim();
    if (!trimmed || trimmed.length < 3) {
      autosuggestEl.classList.remove("visible");
      autosuggestEl.innerHTML = "";
      return;
    }

    const q = trimmed.toLowerCase();
    const suggestions = termList.filter(t => t.startsWith(q)).slice(0, 20);

    if (!suggestions.length) {
      autosuggestEl.classList.remove("visible");
      autosuggestEl.innerHTML = "";
      return;
    }

    autosuggestEl.innerHTML = suggestions
      .map(s => `<div class="autosuggest-item" data-value="${s}">${s}</div>`)
      .join("");
    autosuggestEl.classList.add("visible");
  }

  searchInput.addEventListener("input", (e) => updateAutosuggest(e.target.value));
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const term = e.target.value.trim();
      if (term) runSearch(term);
    }
  });

  autosuggestEl.addEventListener("click", (e) => {
    const item = e.target.closest(".autosuggest-item");
    if (!item) return;
    const value = item.dataset.value;
    searchInput.value = value;
    autosuggestEl.classList.remove("visible");
    runSearch(value);
  });

  function normalizeToken(t) {
    return (t || "").toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "").trim();
  }

  function getMatchesForTerm(term) {
    const q = normalizeToken(term);
    if (!q) return [];

    const matches = [];
    const seen = new Set();

    // Original OCR-derived matches.
    for (const w of ocrWords) {
      const token = normalizeToken(w.text);
      const hit = q.length <= 2 ? token === q : token.includes(q);
      if (!hit || !w.bbox) continue;
      const key = `${Math.round(w.bbox.x0)}|${Math.round(w.bbox.y0)}|${Math.round(w.bbox.x1)}|${Math.round(w.bbox.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push(w);
      }
    }

    // AI-read literal spine text, including books the model could not identify.
    for (const w of aiSpineWords) {
      const token = normalizeToken(w.text);
      const hit = q.length <= 2 ? token === q : token.includes(q);
      if (!hit || !w.bbox) continue;
      const key = `${Math.round(w.bbox.x0)}|${Math.round(w.bbox.y0)}|${Math.round(w.bbox.x1)}|${Math.round(w.bbox.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push(w);
      }
    }

    // Catalog-derived title/author terms. These let Spineless find words Tesseract never read.
    for (const entry of bookCatalog) {
      if (!entry || !entry.match || !entry.match.bbox || !entry.result) continue;
      const tokens = [
        ...extractCatalogTokens(entry.result.title),
        ...extractCatalogTokens(entry.result.author)
      ];
      if (!tokens.includes(q)) continue;

      const b = entry.match.bbox;
      const key = `${Math.round(b.x0)}|${Math.round(b.y0)}|${Math.round(b.x1)}|${Math.round(b.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push({
          ...entry.match,
          text: q,
          catalogEntry: entry,
          confidence: Math.max(Number(entry.result.confidence || 0) * 100, Number(entry.match.confidence || 0))
        });
      }
    }

    return matches;
  }

  function runSearch(term) {
    if (!ocrWords.length || !termList.length) return;

    const raw = term.trim();
    if (!raw) return;

    const q = normalizeToken(raw);
    if (!q) { alert(`No matches found for “${raw}”`); return; }

    let idx = termList.findIndex(t => t === q);
    if (idx === -1) idx = termList.findIndex(t => t.startsWith(q));
    if (idx === -1 && q.length >= 3) idx = termList.findIndex(t => t.includes(q));

    if (idx === -1) { alert(`No matches found for “${raw}”`); return; }

    currentTermIndex = idx;
    currentTerm = termList[currentTermIndex];

    currentMatches = getMatchesForTerm(currentTerm);
    currentMatchIndex = 0;

    setupResultsScreen();
    showScreen(screenResults);
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  function truncateLabel(text, maxLen) {
    if (!text) return "";
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen - 1) + "…";
  }

  function updateInstanceNav() {
    if (!currentMatches || currentMatches.length <= 1) {
      pillBadge.classList.add("hidden");
      pillBadge.innerHTML = "";
      hitPrevInline.disabled = true;
      hitNextInline.disabled = true;
      hitPrevInline.classList.add("hidden");
      hitNextInline.classList.add("hidden");
      return;
    }
    const current = currentMatchIndex + 1;
    const total = currentMatches.length;
    pillBadge.classList.remove("hidden");
    pillBadge.innerHTML =
      `<span class="pill-badge-current">${current}</span>` +
      `<span class="pill-badge-total">${total}</span>`;
    hitPrevInline.disabled = false;
    hitNextInline.disabled = false;
    hitPrevInline.classList.remove("hidden");
    hitNextInline.classList.remove("hidden");
  }

  function setRecognizedTitle(text, state = "") {
    if (!recognizedTitle || !recognizedTitleWrap) return;
    recognizedTitle.classList.remove("is-loading", "is-uncertain");
    if (!text) {
      recognizedTitle.textContent = "";
      recognizedTitleWrap.classList.add("hidden");
      return;
    }
    recognizedTitle.textContent = text;
    if (state) recognizedTitle.classList.add(state);
    recognizedTitleWrap.classList.remove("hidden");
  }

  function bboxCenter(b) {
    return { x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2 };
  }

  function buildRecognitionContext(match) {
    if (!sourceCanvas || !match || !match.bbox) return null;
    const b = match.bbox;
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const c = bboxCenter(b);

    // Send the whole shelf image so the vision model can infer the actual book boundaries.
    // We draw a conspicuous marker around the OCR hit so the model knows exactly which
    // word/spine the user selected without relying only on coordinate math.
    const maxDim = 1600;
    const scale = Math.min(1, maxDim / Math.max(W, H));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(W * scale));
    canvas.height = Math.max(1, Math.round(H * scale));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);

    const sx = canvas.width / W;
    const sy = canvas.height / H;
    const x = b.x0 * sx;
    const y = b.y0 * sy;
    const bw = Math.max(2, (b.x1 - b.x0) * sx);
    const bh = Math.max(2, (b.y1 - b.y0) * sy);
    const pad = Math.max(8, Math.min(24, Math.max(bw, bh) * 0.35));

    ctx.save();
    ctx.strokeStyle = "#ff2d2d";
    ctx.lineWidth = Math.max(5, Math.round(Math.min(canvas.width, canvas.height) / 180));
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 8;
    ctx.strokeRect(
      Math.max(1, x - pad),
      Math.max(1, y - pad),
      Math.min(canvas.width - x + pad - 1, bw + pad * 2),
      Math.min(canvas.height - y + pad - 1, bh + pad * 2)
    );
    ctx.restore();

    // Gather OCR context primarily by physical proximity to the selected word.
    // This is only a hint; the model gets the full image and can read the rest itself.
    const nearby = ocrWords
      .filter(w => w && w.bbox)
      .map(w => ({
        text: normalizeToken(w.text),
        confidence: typeof w.confidence === "number" ? w.confidence : 0,
        d: Math.hypot(bboxCenter(w.bbox).x - c.x, bboxCenter(w.bbox).y - c.y)
      }))
      .filter(w => w.text && w.text.length > 1)
      .sort((a,b) => (a.d - b.d) || (b.confidence - a.confidence));

    const contextWords = [];
    for (const w of nearby) {
      if (!contextWords.includes(w.text)) contextWords.push(w.text);
      if (contextWords.length >= 12) break;
    }

    return {
      image: canvas.toDataURL("image/jpeg", 0.90),
      contextWords,
      target: {
        x0: b.x0 / W,
        y0: b.y0 / H,
        x1: b.x1 / W,
        y1: b.y1 / H,
        centerX: c.x / W,
        centerY: c.y / H
      }
    };
  }

  async function searchOpenLibraryCandidates(searchTerm, contextWords) {
    const queries = [];
    const strongContext = (contextWords || []).filter(w => w.length >= 3 && w !== searchTerm).slice(0, 4);
    if (strongContext.length) queries.push([searchTerm, ...strongContext].join(" "));
    queries.push(searchTerm);

    const merged = new Map();
    for (const q of queries) {
      try {
        const params = new URLSearchParams({
          q,
          fields: "key,title,author_name,first_publish_year,edition_key,cover_i,isbn,publisher",
          limit: "12"
        });
        const resp = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
        if (!resp.ok) continue;
        const data = await resp.json();
        for (const doc of (data.docs || [])) {
          if (!doc.title) continue;
          const key = doc.key || `${doc.title}|${(doc.author_name || [""])[0]}`;
          if (merged.has(key)) continue;
          merged.set(key, {
            key: doc.key || null,
            title: doc.title,
            author: (doc.author_name || []).slice(0, 3).join(", "),
            year: doc.first_publish_year || null,
            cover_i: doc.cover_i || null,
            isbn: (doc.isbn || []).slice(0, 4),
            publisher: (doc.publisher || []).slice(0, 3),
            edition_key: (doc.edition_key || []).slice(0, 4)
          });
          if (merged.size >= 12) break;
        }
      } catch (err) {
        console.warn("Open Library candidate lookup failed:", err);
      }
      if (merged.size >= 12) break;
    }
    return Array.from(merged.values()).slice(0, 12);
  }

  function recognitionCacheKey(match, term = currentTerm) {
    if (!match || !match.bbox) return "";
    const b = match.bbox;
    return [term || "", Math.round(b.x0), Math.round(b.y0), Math.round(b.x1), Math.round(b.y1)].join("|");
  }

  function normalizedDistanceBetweenMatches(a, b) {
    if (!sourceCanvas || !a || !b || !a.bbox || !b.bbox) return Infinity;
    const ca = bboxCenter(a.bbox), cb = bboxCenter(b.bbox);
    const dx = (ca.x - cb.x) / sourceCanvas.width;
    const dy = (ca.y - cb.y) / sourceCanvas.height;
    return Math.hypot(dx, dy);
  }

  function findCatalogEntryForMatch(match) {
    if (!match || !bookCatalog.length) return null;
    let best = null, bestD = Infinity;
    for (const entry of bookCatalog) {
      const d = normalizedDistanceBetweenMatches(match, entry.match);
      if (d < bestD) { bestD = d; best = entry; }
    }
    // Tight enough to usually mean the same physical book, but forgiving of different OCR words on it.
    return bestD <= 0.045 ? best : null;
  }

  async function identifyMatch(match, searchTerm, options = {}) {
    if (!BOOK_ID_ENABLED || !match || !sourceCanvas) return null;
    const { updateUI = false, serial = null } = options;

    const existingCatalog = findCatalogEntryForMatch(match);
    if (existingCatalog && existingCatalog.result && existingCatalog.result.title !== "Unknown title") {
      return existingCatalog.result;
    }

    const cacheKey = recognitionCacheKey(match, searchTerm);
    if (bookRecognitionCache.has(cacheKey)) return bookRecognitionCache.get(cacheKey);

    if (updateUI) setRecognizedTitle("identifying…", "is-loading");
    const recognitionContext = buildRecognitionContext(match);
    if (!recognitionContext) return null;

    const candidates = await searchOpenLibraryCandidates(searchTerm, recognitionContext.contextWords);
    if (serial !== null && serial !== recognitionRequestSerial) return null;

    try {
      const resp = await fetch(BOOK_ID_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: recognitionContext.image,
          searchTerm,
          ocrWords: recognitionContext.contextWords,
          target: recognitionContext.target,
          candidates
        })
      });
      if (!resp.ok) {
        let detail = "";
        try { detail = JSON.stringify(await resp.json()); } catch (_) { detail = await resp.text(); }
        throw new Error(`Book identification failed (${resp.status}) ${detail}`);
      }
      const result = await resp.json();
      const candidateIndex = Number.isFinite(Number(result && result.candidateIndex)) ? Number(result.candidateIndex) : -1;
      const matchedCandidate = candidateIndex >= 0 && candidateIndex < candidates.length ? candidates[candidateIndex] : null;
      const clean = {
        title: result && result.title ? String(result.title) : "Unknown title",
        author: result && result.author ? String(result.author) : "",
        confidence: Number.isFinite(Number(result && result.confidence)) ? Number(result.confidence) : 0,
        candidateIndex,
        year: matchedCandidate ? matchedCandidate.year : null,
        publisher: matchedCandidate && matchedCandidate.publisher ? matchedCandidate.publisher : [],
        isbn: matchedCandidate && matchedCandidate.isbn ? matchedCandidate.isbn : [],
        cover_i: matchedCandidate ? matchedCandidate.cover_i : null,
        openLibraryKey: matchedCandidate ? matchedCandidate.key : null
      };
      bookRecognitionCache.set(cacheKey, clean);
      return clean;
    } catch (err) {
      console.warn(err);
      return { title: "AI recognition error", author: "", confidence: 0, candidateIndex: -1, error: true };
    }
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Math.round(Number(seconds) || 0));
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function updateCatalogStats(elapsedSeconds) {
    const label = `${bookCatalog.length} books · ${termList.length} terms · ${formatDuration(elapsedSeconds)}`;
    if (catalogStats) {
      catalogStats.textContent = label;
      catalogStats.classList.add("visible");
    }
    if (searchCatalogStats) {
      searchCatalogStats.textContent = label;
      searchCatalogStats.classList.add("visible");
    }
  }

  async function enrichCatalogFromOpenLibrary(runSerial) {
    const queue = bookCatalog.filter(e => e && e.result && e.result.title);
    let cursor = 0;
    const concurrency = 5;

    async function worker() {
      while (cursor < queue.length && runSerial === catalogingRunSerial) {
        const entry = queue[cursor++];
        try {
          const params = new URLSearchParams({
            title: entry.result.title,
            author: entry.result.author || "",
            fields: "key,title,author_name,first_publish_year,cover_i,isbn,publisher",
            limit: "3"
          });
          const resp = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
          if (!resp.ok) continue;
          const data = await resp.json();
          const doc = (data.docs || [])[0];
          if (!doc) continue;

          entry.result.year = doc.first_publish_year || entry.result.year || null;
          entry.result.publisher = (doc.publisher || []).slice(0, 3);
          entry.result.isbn = (doc.isbn || []).slice(0, 4);
          entry.result.cover_i = doc.cover_i || null;
          entry.result.openLibraryKey = doc.key || null;
        } catch (err) {
          console.warn("Open Library enrichment failed:", err);
        }
      }
    }

    await Promise.all(Array.from({length: Math.min(concurrency, queue.length || 1)}, () => worker()));
  }

  function makeShelfRegions() {
    if (!sourceCanvas) return [];
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const bands = 6;
    const overlap = 0.12;
    const regions = [];

    for (let i = 0; i < bands; i++) {
      const bandH = H / bands;
      const y0 = Math.max(0, i * bandH - bandH * overlap);
      const y1 = Math.min(H, (i + 1) * bandH + bandH * overlap);

      const words = ocrWords
        .filter(w => w && w.bbox)
        .filter(w => {
          const c = bboxCenter(w.bbox);
          return c.y >= y0 && c.y <= y1;
        })
        .map(w => ({
          text: normalizeToken(w.text),
          confidence: Number(w.confidence || 0),
          bbox: {
            x0: w.bbox.x0 / W,
            y0: (w.bbox.y0 - y0) / (y1 - y0),
            x1: w.bbox.x1 / W,
            y1: (w.bbox.y1 - y0) / (y1 - y0)
          }
        }))
        .filter(w => w.text && w.text.length > 1)
        .sort((a,b) => b.confidence - a.confidence)
        .slice(0, 90);

      regions.push({ index: i, x0: 0, y0, x1: W, y1, words });
    }
    return regions;
  }

  function renderRegionImage(region) {
    const cropW = region.x1 - region.x0;
    const cropH = region.y1 - region.y0;
    const canvas = document.createElement("canvas");
    const maxW = 1500;
    const scale = Math.min(1, maxW / cropW);
    canvas.width = Math.max(1, Math.round(cropW * scale));
    canvas.height = Math.max(1, Math.round(cropH * scale));
    canvas.getContext("2d").drawImage(
      sourceCanvas,
      region.x0, region.y0, cropW, cropH,
      0, 0, canvas.width, canvas.height
    );
    return canvas.toDataURL("image/jpeg", 0.84);
  }

  function regionBookToCatalogEntry(book, region) {
    if (!book || !book.title) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = book.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);

    const bbox = {
      x0: x0 * W,
      y0: region.y0 + y0 * regionH,
      x1: Math.max(x0 * W + 2, x1 * W),
      y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
    };

    return {
      match: {
        text: book.title,
        bbox,
        confidence: Math.round((Number(book.confidence) || 0) * 100)
      },
      term: extractCatalogTokens(book.title)[0] || "",
      result: {
        title: String(book.title),
        author: book.author ? String(book.author) : "",
        confidence: Number(book.confidence) || 0,
        candidateIndex: -1,
        year: book.year || null,
        publisher: book.publisher ? [String(book.publisher)] : [],
        isbn: book.isbn ? [String(book.isbn)] : [],
        cover_i: null,
        openLibraryKey: null
      }
    };
  }

  function regionSpineToGlobal(spine, region) {
    if (!spine || !spine.bbox) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = spine.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);
    if (x1 <= x0 || y1 <= y0) return null;
    return {
      confidence: Number(spine.confidence) || 0,
      bbox: {
        x0: x0 * W,
        y0: region.y0 + y0 * regionH,
        x1: Math.max(x0 * W + 2, x1 * W),
        y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
      }
    };
  }

  function regionWordToGlobal(word, region) {
    if (!word || !word.text || !word.bbox) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = word.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);
    const token = normalizeToken(word.text);
    if (!token || token.length < 2) return null;

    return {
      text: token,
      rawText: String(word.text),
      confidence: Math.round((Number(word.confidence) || 0) * 100),
      source: "ai-spine",
      bbox: {
        x0: x0 * W,
        y0: region.y0 + y0 * regionH,
        x1: Math.max(x0 * W + 2, x1 * W),
        y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
      }
    };
  }

  function sameAIWord(a, b) {
    if (!a || !b || normalizeToken(a.text) !== normalizeToken(b.text)) return false;
    const A = bboxCenter(a.bbox), B = bboxCenter(b.bbox);
    return Math.hypot(A.x - B.x, A.y - B.y) < Math.max(35, sourceCanvas.width * 0.035);
  }

  function bboxIoU(a, b) {
    const ix0 = Math.max(a.x0, b.x0), iy0 = Math.max(a.y0, b.y0);
    const ix1 = Math.min(a.x1, b.x1), iy1 = Math.min(a.y1, b.y1);
    const iw = Math.max(0, ix1 - ix0), ih = Math.max(0, iy1 - iy0);
    const inter = iw * ih;
    const aa = Math.max(1, (a.x1-a.x0)*(a.y1-a.y0));
    const ba = Math.max(1, (b.x1-b.x0)*(b.y1-b.y0));
    return inter / Math.max(1, aa + ba - inter);
  }

  function sameDetectedSpine(a, b) {
    if (!a || !b) return false;
    const A = bboxCenter(a.bbox), B = bboxCenter(b.bbox);
    const aw = a.bbox.x1-a.bbox.x0, bw = b.bbox.x1-b.bbox.x0;
    const ah = a.bbox.y1-a.bbox.y0, bh = b.bbox.y1-b.bbox.y0;
    const centerDist = Math.hypot(A.x-B.x, A.y-B.y);
    return bboxIoU(a.bbox,b.bbox) > 0.42 ||
      (centerDist < Math.max(18, Math.min(aw,bw)*0.55) && Math.abs(ah-bh) < Math.max(60, Math.max(ah,bh)*0.45));
  }

  function renderSpineCrop(spine) {
    const b = spine.bbox;
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const bw = b.x1-b.x0, bh = b.y1-b.y0;
    const padX = Math.max(8, bw * 0.28);
    const padY = Math.max(8, bh * 0.05);
    const x0 = Math.max(0, b.x0-padX), y0 = Math.max(0, b.y0-padY);
    const x1 = Math.min(W, b.x1+padX), y1 = Math.min(H, b.y1+padY);
    const cropW = x1-x0, cropH = y1-y0;
    const canvas = document.createElement("canvas");
    const maxDim = 900;
    const scale = Math.min(1.5, maxDim / Math.max(cropW,cropH));
    canvas.width = Math.max(1, Math.round(cropW*scale));
    canvas.height = Math.max(1, Math.round(cropH*scale));
    canvas.getContext("2d").drawImage(sourceCanvas, x0,y0,cropW,cropH, 0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg", 0.9);
  }

  function ocrHintsForSpine(spine) {
    const b = spine.bbox;
    const pad = Math.max(12, (b.x1-b.x0)*0.35);
    return ocrWords
      .filter(w => w && w.bbox)
      .filter(w => {
        const c = bboxCenter(w.bbox);
        return c.x >= b.x0-pad && c.x <= b.x1+pad && c.y >= b.y0-20 && c.y <= b.y1+20;
      })
      .sort((a,b) => Number(b.confidence||0)-Number(a.confidence||0))
      .slice(0,20)
      .map(w => String(w.text||"").trim())
      .filter(Boolean);
  }

  function spineResultToCatalogEntry(spine, result) {
    if (!result || !result.title || result.title === "Unknown title") return null;
    return {
      match: {
        text: result.title,
        bbox: spine.bbox,
        confidence: Math.round((Number(result.confidence)||0)*100)
      },
      term: extractCatalogTokens(result.title)[0] || "",
      result: {
        title: String(result.title),
        author: result.author ? String(result.author) : "",
        confidence: Number(result.confidence)||0,
        candidateIndex: -1,
        year: null,
        publisher: [],
        isbn: [],
        cover_i: null,
        openLibraryKey: null
      }
    };
  }

  function sameCatalogBook(a, b) {
    if (!a || !b || !a.result || !b.result) return false;
    const at = normalizeToken(a.result.title), bt = normalizeToken(b.result.title);
    if (!at || at !== bt) return false;
    const A = bboxCenter(a.match.bbox), B = bboxCenter(b.match.bbox);
    return Math.hypot(A.x - B.x, A.y - B.y) < Math.max(100, sourceCanvas.width * 0.12);
  }

  async function identifyShelfRegion(region, runSerial, scanPass = 1) {
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "region",
        image: renderRegionImage(region),
        regionIndex: region.index,
        scanPass,
        ocrWords: region.words
      })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Region identification failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return { books: [], words: [] };
    return {
      books: (Array.isArray(data.books) ? data.books : [])
        .map(book => regionBookToCatalogEntry(book, region))
        .filter(Boolean),
      words: (Array.isArray(data.visibleWords) ? data.visibleWords : [])
        .map(word => regionWordToGlobal(word, region))
        .filter(Boolean)
    };
  }


  function spineCoveredByCatalog(spine) {
    if (!spine || !spine.bbox) return false;
    const sc = bboxCenter(spine.bbox);
    for (const entry of bookCatalog) {
      if (!entry || !entry.match || !entry.match.bbox) continue;
      const b = entry.match.bbox;
      const padX = Math.max(8, (b.x1 - b.x0) * 0.18);
      const padY = Math.max(8, (b.y1 - b.y0) * 0.08);
      const inside =
        sc.x >= b.x0 - padX && sc.x <= b.x1 + padX &&
        sc.y >= b.y0 - padY && sc.y <= b.y1 + padY;
      if (inside || bboxIoU(spine.bbox, b) > 0.22) return true;
    }
    return false;
  }

  async function detectShelfRegion(region, runSerial) {
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "detect-region",
        image: renderRegionImage(region),
        regionIndex: region.index,
        ocrWords: region.words
      })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Spine detection failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return { spines: [], words: [] };
    return {
      spines: (Array.isArray(data.spines) ? data.spines : []).map(s => regionSpineToGlobal(s,region)).filter(Boolean),
      words: (Array.isArray(data.visibleWords) ? data.visibleWords : []).map(w => regionWordToGlobal(w,region)).filter(Boolean)
    };
  }

  async function identifySpineBatch(batch, runSerial) {
    const payload = batch.map((spine, i) => ({
      id: String(spine.id),
      image: renderSpineCrop(spine),
      ocrWords: ocrHintsForSpine(spine)
    }));
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "spine-batch", spines: payload })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Spine identification failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return [];
    return Array.isArray(data.results) ? data.results : [];
  }

  async function catalogBooks() {
    if (!BOOK_ID_ENABLED || !sourceCanvas || !ocrWords.length) return;

    const runSerial = ++catalogingRunSerial;
    const startedAt = performance.now();
    catalogingActive = true;
    bookCatalog = [];
    aiSpineWords = [];
    catalogTerms.clear();
    bookRecognitionCache.clear();
    if (catalogStats) catalogStats.classList.remove("visible");

    const regions = makeShelfRegions();
    catalogingOverlay.classList.add("visible");
    catalogingBar.style.width = "0%";

    // PASSES 1–3: three complementary whole-region reads.
    const passAdds = [];
    const fastConcurrency = 3;

    async function runBroadPass(passIndex) {
      let fastCursor = 0;
      let fastDone = 0;
      const before = bookCatalog.length;

      async function fastWorker() {
        while (fastCursor < regions.length && runSerial === catalogingRunSerial) {
          const region = regions[fastCursor++];
          try {
            const rr = await identifyShelfRegion(region, runSerial, passIndex);

            for (const entry of rr.books) {
              const dupe = bookCatalog.find(existing => sameCatalogBook(existing, entry));
              if (!dupe) bookCatalog.push(entry);
              else if ((entry.result.confidence || 0) > (dupe.result.confidence || 0)) {
                Object.assign(dupe, entry);
              }
            }

            for (const word of rr.words) {
              const dupe = aiSpineWords.find(existing => sameAIWord(existing, word));
              if (!dupe) aiSpineWords.push(word);
              else if ((word.confidence || 0) > (dupe.confidence || 0)) {
                Object.assign(dupe, word);
              }
            }

            buildTermList();
          } catch (err) {
            console.warn(`AI pass ${passIndex} region failed:`, err);
          }

          fastDone++;
          const completedBroad =
            ((passIndex - 1) * regions.length) + fastDone;
          const totalBroad = regions.length * 3;

          catalogingStatus.textContent =
            `AI pass ${passIndex} of 3 · ${fastDone} of ${regions.length} regions · ${bookCatalog.length} books`;
          catalogingBar.style.width =
            `${Math.round((completedBroad / totalBroad) * 58)}%`;

          if (catalogingEta) {
            catalogingEta.textContent =
              `Pass ${passIndex} added ${Math.max(0, bookCatalog.length - before)} unique books so far`;
          }
        }
      }

      await Promise.all(
        Array.from(
          { length: Math.min(fastConcurrency, regions.length) },
          () => fastWorker()
        )
      );

      passAdds.push(Math.max(0, bookCatalog.length - before));
    }

    for (let passIndex = 1; passIndex <= 3; passIndex++) {
      await runBroadPass(passIndex);
      if (runSerial !== catalogingRunSerial) return;
    }

    const initialBookCount = bookCatalog.length;

    if (catalogingEta) {
      catalogingEta.textContent =
        `3-pass gains: +${passAdds[0] || 0} · +${passAdds[1] || 0} · +${passAdds[2] || 0}`;
    }

    // PASS 2: detect all physical spines, then recover only those not already covered.
    catalogingStatus.textContent = `${initialBookCount} found · checking for missed books`;
    if (catalogingEta) catalogingEta.textContent = "Detecting remaining spines…";

    const detectedSpines = [];
    let detectCursor = 0, detectDone = 0;
    const detectConcurrency = 3;

    async function detectWorker() {
      while (detectCursor < regions.length && runSerial === catalogingRunSerial) {
        const region = regions[detectCursor++];
        try {
          const rr = await detectShelfRegion(region, runSerial);
          for (const spine of rr.spines) {
            const dupe = detectedSpines.find(s => sameDetectedSpine(s, spine));
            if (!dupe) detectedSpines.push(spine);
            else if ((spine.confidence || 0) > (dupe.confidence || 0)) Object.assign(dupe, spine);
          }
          for (const word of rr.words) {
            const dupe = aiSpineWords.find(existing => sameAIWord(existing, word));
            if (!dupe) aiSpineWords.push(word);
            else if ((word.confidence || 0) > (dupe.confidence || 0)) Object.assign(dupe, word);
          }
          buildTermList();
        } catch (err) { console.warn(err); }
        detectDone++;
        catalogingStatus.textContent = `${initialBookCount} found · ${detectedSpines.length} spines detected`;
        catalogingBar.style.width = `${58 + Math.round((detectDone / regions.length) * 15)}%`;
      }
    }

    await Promise.all(Array.from({length: Math.min(detectConcurrency, regions.length)}, () => detectWorker()));
    if (runSerial !== catalogingRunSerial) return;

    detectedSpines.sort((a,b) => (a.bbox.y0-b.bbox.y0) || (a.bbox.x0-b.bbox.x0));
    const recoverySpines = detectedSpines.filter(spine => !spineCoveredByCatalog(spine));
    recoverySpines.forEach((s,i) => s.id = i + 1);

    // PASS 3: identify only missed spines.
    const batchSize = 8;
    const batches = [];
    for (let i = 0; i < recoverySpines.length; i += batchSize) batches.push(recoverySpines.slice(i, i + batchSize));

    let batchCursor = 0, batchesDone = 0;
    // Keep recovery slightly conservative to reduce burst-rate 429s.
    const identifyConcurrency = 2;
    if (catalogingEta) {
      catalogingEta.textContent = `${detectedSpines.length} spines detected · ${recoverySpines.length} possible misses to recover`;
    }

    async function recoverWorker() {
      while (batchCursor < batches.length && runSerial === catalogingRunSerial) {
        const batch = batches[batchCursor++];
        try {
          const results = await identifySpineBatch(batch, runSerial);
          const byId = new Map(results.map(r => [String(r.id), r]));
          for (const spine of batch) {
            const result = byId.get(String(spine.id));
            const entry = spineResultToCatalogEntry(spine, result);
            if (!entry) continue;
            const dupe = bookCatalog.find(existing => sameCatalogBook(existing, entry));
            if (!dupe) bookCatalog.push(entry);
            else if ((entry.result.confidence || 0) > (dupe.result.confidence || 0)) Object.assign(dupe, entry);
          }
          buildTermList();
        } catch (err) { console.warn(err); }
        batchesDone++;
        const recovered = Math.max(0, bookCatalog.length - initialBookCount);
        catalogingStatus.textContent =
          `${bookCatalog.length} books · ${recovered} recovered · ${detectedSpines.length} spines detected`;
        catalogingBar.style.width =
          `${73 + Math.round((batchesDone / Math.max(1, batches.length)) * 20)}%`;
      }
    }

    if (batches.length) {
      await Promise.all(Array.from({length: Math.min(identifyConcurrency, batches.length)}, () => recoverWorker()));
    }
    if (runSerial !== catalogingRunSerial) return;

    if (catalogingEta) catalogingEta.textContent = "Adding book details…";
    catalogingBar.style.width = "95%";
    await enrichCatalogFromOpenLibrary(runSerial);
    if (runSerial !== catalogingRunSerial) return;

    catalogingActive = false;
    buildTermList();
    const elapsed = (performance.now() - startedAt) / 1000;
    const recovered = Math.max(0, bookCatalog.length - initialBookCount);
    catalogingStatus.textContent = `${bookCatalog.length} books · ${termList.length} searchable terms`;
    if (catalogingEta) {
      catalogingEta.textContent =
        `3-pass ${initialBookCount} + ${recovered} recovered · ${detectedSpines.length} spines detected · ${formatDuration(elapsed)}`;
    }
    catalogingBar.style.width = "100%";
    updateCatalogStats(elapsed);

    await new Promise(resolve => setTimeout(resolve, 1100));
    catalogingOverlay.classList.remove("visible");
  }


  async function identifyCurrentBook() {
    if (!BOOK_ID_ENABLED || !currentMatches.length || !sourceCanvas) {
      setRecognizedTitle("");
      return;
    }

    const match = currentMatches[currentMatchIndex] || currentMatches[0];
    const catalogEntry = findCatalogEntryForMatch(match);
    if (catalogEntry && catalogEntry.result) {
      const r = catalogEntry.result;
      setRecognizedTitle(r.title || "Unknown title", r.confidence < 0.55 ? "is-uncertain" : "");
      return;
    }

    const serial = ++recognitionRequestSerial;
    const result = await identifyMatch(match, currentTerm, { updateUI: true, serial });
    if (serial !== recognitionRequestSerial || !result) return;
    if (result.error) {
      setRecognizedTitle("AI recognition error", "is-uncertain");
      return;
    }
    setRecognizedTitle(result.title || "Unknown title", result.confidence < 0.55 ? "is-uncertain" : "");
    if (result.title && result.title !== "Unknown title") {
      bookCatalog.push({ match, term: currentTerm, result });
      buildTermList();
    }
  }

  function setupResultsScreen() {
    resultsImage.src = imageDataUrl;

    if (currentTermIndex < 0 || !termList.length) {
      pillMainLabel.textContent = "";
      pillLeft.textContent = "";
      pillRight.textContent = "";
      pillLeft.classList.add("disabled");
      pillRight.classList.add("disabled");
      pillBadge.classList.add("hidden");
      pillBadge.innerHTML = "";
      hitPrevInline.disabled = true;
      hitNextInline.disabled = true;
      hitPrevInline.classList.add("hidden");
      hitNextInline.classList.add("hidden");
      return;
    }

    const foundTerm = termList[currentTermIndex];
    pillMainLabel.textContent = truncateLabel(foundTerm, 10);

    const prevIndex = findPrevDictIndex(currentTermIndex);
    const nextIndex = findNextDictIndex(currentTermIndex);

    if (prevIndex === -1 && nextIndex === -1) {
      pillLeft.textContent = "";
      pillRight.textContent = "";
      pillLeft.classList.add("disabled");
      pillRight.classList.add("disabled");
    } else if (prevIndex === nextIndex || (prevIndex === -1 || nextIndex === -1)) {
      const idx = prevIndex !== -1 ? prevIndex : nextIndex;
      const label = truncateLabel(termList[idx], 10);
      pillLeft.textContent = label;
      pillRight.textContent = label;
      pillLeft.classList.add("disabled");
      pillRight.classList.add("disabled");
    } else {
      pillLeft.textContent = truncateLabel(termList[prevIndex], 10);
      pillRight.textContent = truncateLabel(termList[nextIndex], 10);
      pillLeft.classList.remove("disabled");
      pillRight.classList.remove("disabled");
    }
    updateInstanceNav();
  }

  function clearHighlights() {
    while (highlightsLayer.firstChild) highlightsLayer.removeChild(highlightsLayer.firstChild);
  }

  function drawHighlightsForTerm(term, matchIndex = 0) {
    if (!term || !ocrWords.length || !resultsImage.src) return;

    const matches = (currentMatches && currentMatches.length) ? currentMatches : getMatchesForTerm(term);
    clearHighlights();

    if (!matches.length) {
      pillBadge.classList.add("hidden");
      pillBadge.innerHTML = "";
      hitPrevInline.disabled = true;
      hitNextInline.disabled = true;
      hitPrevInline.classList.add("hidden");
      hitNextInline.classList.add("hidden");
      return;
    }

    if (matchIndex < 0) matchIndex = 0;
    if (matchIndex >= matches.length) matchIndex = matches.length - 1;

    const img = resultsImage;
    if (!img.naturalWidth || !img.naturalHeight) {
      img.onload = () => drawHighlightsForTerm(term, matchIndex);
      return;
    }

    const displayWidth = img.clientWidth;
    const displayHeight = img.clientHeight;
    if (!displayWidth || !displayHeight) return;

    const scaleX = displayWidth / img.naturalWidth;
    const scaleY = displayHeight / img.naturalHeight;

    const imgRect = img.getBoundingClientRect();
    const wrapRect = resultsImageInner.getBoundingClientRect();
    const offsetLeft = imgRect.left - wrapRect.left;
    const offsetTop = imgRect.top - wrapRect.top;

    const imgLeft = offsetLeft;
    const imgTop = offsetTop;
    const imgRight = offsetLeft + displayWidth;
    const imgBottom = offsetTop + displayHeight;

    const target = matches[matchIndex];
    const bbox = target.bbox;

    const x = bbox.x0 * scaleX;
    const y = bbox.y0 * scaleY;
    const w = (bbox.x1 - bbox.x0) * scaleX;
    const h = (bbox.y1 - bbox.y0) * scaleY;

    const centerX = offsetLeft + x + w / 2;
    const centerY = offsetTop + y + h / 2;

    const gapPadding = 10;
    const lineThickness = 4;
    const gapX = w / 2 + gapPadding;
    const gapY = h / 2 + gapPadding;

    function addDiagonal(startX, startY, endX, endY) {
      const line = document.createElement("div");
      line.className = "crosshair-line";
      const dx = endX - startX, dy = endY - startY;
      const length = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx) * (180 / Math.PI);
      line.style.width = length + "px";
      line.style.height = lineThickness + "px";
      line.style.left = startX + "px";
      line.style.top = startY + "px";
      line.style.transform = `rotate(${angle}deg)`;
      line.style.transformOrigin = "0 50%";
      highlightsLayer.appendChild(line);
    }

    addDiagonal(centerX - gapX, centerY - gapY, imgLeft, imgTop);
    addDiagonal(centerX + gapX, centerY + gapY, imgRight, imgBottom);
    addDiagonal(centerX + gapX, centerY - gapY, imgRight, imgTop);
    addDiagonal(centerX - gapX, centerY + gapY, imgLeft, imgBottom);

    currentMatches = matches;
    currentMatchIndex = matchIndex;
    updateInstanceNav();
    identifyCurrentBook();
  }

  function goPrevTerm() {
    if (!termList.length) return;
    const newIndex = findPrevDictIndex(currentTermIndex);
    if (newIndex === -1) return;
    currentTermIndex = newIndex;
    currentTerm = termList[currentTermIndex];
    currentMatches = getMatchesForTerm(currentTerm);
    currentMatchIndex = 0;
    setupResultsScreen();
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  function goNextTerm() {
    if (!termList.length) return;
    const newIndex = findNextDictIndex(currentTermIndex);
    if (newIndex === -1) return;
    currentTermIndex = newIndex;
    currentTerm = termList[currentTermIndex];
    currentMatches = getMatchesForTerm(currentTerm);
    currentMatchIndex = 0;
    setupResultsScreen();
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  function goPrevInstance() {
    if (!currentMatches.length) return;
    currentMatchIndex = (currentMatchIndex - 1 + currentMatches.length) % currentMatches.length;
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  function goNextInstance() {
    if (!currentMatches.length) return;
    currentMatchIndex = (currentMatchIndex + 1) % currentMatches.length;
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  pillLeft.addEventListener("click", goPrevTerm);
  pillRight.addEventListener("click", goNextTerm);

  if (hitPrevBtn) hitPrevBtn.addEventListener("click", goPrevInstance);
  if (hitNextBtn) hitNextBtn.addEventListener("click", goNextInstance);

  hitPrevInline.addEventListener("click", (e) => { e.stopPropagation(); goPrevInstance(); });
  hitNextInline.addEventListener("click", (e) => { e.stopPropagation(); goNextInstance(); });

  let touchStartX = null;
  resultsImageInner.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; });
  resultsImageInner.addEventListener("touchend", (e) => {
    if (touchStartX == null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40) {
      if (dx < 0) goNextTerm();
      else goPrevTerm();
    }
    touchStartX = null;
  });

  window.addEventListener("resize", () => {
    if (screenResults.classList.contains("active") && currentTerm) {

  function openTermModal() {
    // Use the normalized source canvas so the crop always matches the OCR coordinate space.
    if (!currentMatches.length || !sourceCanvas) return;

    const src = sourceCanvas;
    const match = currentMatches[currentMatchIndex] || currentMatches[0];
    const bbox = match.bbox;

    const padding = 40;
    let x0 = Math.max(0, bbox.x0 - padding);
    let y0 = Math.max(0, bbox.y0 - padding);
    let x1 = Math.min(src.width,  bbox.x1 + padding);
    let y1 = Math.min(src.height, bbox.y1 + padding);

const cropW = Math.max(1, x1 - x0);
    const cropH = Math.max(1, y1 - y0);

    const maxDim = 800;
    const scale = Math.min(maxDim / cropW, maxDim / cropH, 1);
    const outW = cropW * scale;
    const outH = cropH * scale;

    const canvas = termModalCanvas;
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, outW, outH);
    ctx.drawImage(src, x0, y0, cropW, cropH, 0, 0, outW, outH);

    const localX0 = (bbox.x0 - x0) * scale;
    const localY0 = (bbox.y0 - y0) * scale;
    const localW  = (bbox.x1 - bbox.x0) * scale;
    const localH  = (bbox.y1 - bbox.y0) * scale;

    ctx.save();
    ctx.fillStyle = "rgba(255,122,26,0.25)";
    ctx.strokeStyle = "#ff7a1a";
    ctx.lineWidth = Math.max(2, outW / 200);
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 8;
    ctx.fillRect(localX0, localY0, localW, localH);
    ctx.strokeRect(localX0, localY0, localW, localH);
    ctx.restore();

    const conf = match.confidence;
    const confRounded = typeof conf === "number" ? Math.round(conf) : null;
    termModalConfidence.textContent = confRounded != null ? confRounded + "%" : "–%";
    termModal.classList.add("visible");
  }

  function closeTermModal() { termModal.classList.remove("visible"); }

  pillMainLabel.addEventListener("click", () => {
    if (!currentTerm || !currentMatches.length) return;

  termModalBackdrop.addEventListener("click", closeTermModal);

  function getCurrentCatalogEntry() {
    if (!currentMatches.length) return null;

    if (Array.isArray(r.isbn) && r.isbn.length) rows.push(["ISBN", r.isbn[0]]);
    if (Number.isFinite(Number(r.confidence))) rows.push(["AI confidence", `${Math.round(Number(r.confidence) * 100)}%`]);

    bookModalMeta.innerHTML = rows.map(([label, value]) =>

    ).join("");

  bookModalBackdrop.addEventListener("click", closeBookModal);
  bookModalClose.addEventListener("click", closeBookModal);
  bookModal.addEventListener("click", (e) => { if (e.target === bookModal) closeBookModal(); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeTermModal();
      closeBookModal();
    }
  });

  document.addEventListener("gesturestart",  (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gesturechange", (e) => e.preventDefault(), { passive: false });
  document.addEventListener("gestureend",    (e) => e.preventDefault(), { passive: false });

  window.addEventListener("wheel", (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  loadWordLists();
</script>
</body>
</html>
