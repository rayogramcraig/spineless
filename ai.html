<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spineless</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- iOS web app meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="spineless">

  <!-- Favicons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico">

  <!-- iOS home screen icons -->
  <link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120x120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180x180.png">
  <link rel="apple-touch-icon" href="apple-touch-icon-v2.png">

  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg-dark: #111;
      --white: #fff;
      --accent: #ff7a1a;
      --input-bg: #fff;
      --input-text: #111;
      --shadow-soft: 0 12px 30px rgba(0, 0, 0, 0.35);
      --transition-fast: 0.4s ease;
      --transition-med: 0.6s ease;
      --scan-yellow: #e8ff29;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      touch-action: pan-x pan-y;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--white);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }
    .screen.active { display: block; }
    .hidden { display: none !important; }

    /* ADD IMAGE SCREEN */
    #screen-add { background: #111; }
    #screen-add.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #screen-add .label {
      font-size: 3rem;
      font-weight: 700;
      pointer-events: none;
      text-align: center;
    }
    #imageInput {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* OCR (SCANNING + SEARCH) SCREEN */
    #screen-ocr {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    #ocr-bg {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      filter: brightness(0.45);
      transform: scale(1.02);
      z-index: 0;
    }

    /* Floating found-words overlay (during scanning) */
    #scan-word-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2; /* above gradient, below UI text */
    }

    .scan-float-word {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center;
      font-weight: 800;
      letter-spacing: 0.01em;
      color: var(--scan-yellow);
      opacity: 0;
      white-space: nowrap;
      filter: drop-shadow(0 0 16px rgba(0,0,0,0.85));
      text-shadow: 0 0 18px rgba(0,0,0,0.85);
      will-change: transform, opacity;
      animation: floatWord 1.05s ease-out forwards;
    }

    @keyframes floatWord {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
      18%  { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -55%) scale(2.15); }
    }

    #scan-gradient {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      overflow: hidden;
      mix-blend-mode: screen;
      z-index: 1;
    }

    #scan-band { position: absolute; inset: 0; }

    /* 0°: vertical fill */
    #scan-gradient.mode-0 #scan-band {
      top: 0; left: 0; width: 100%; height: 0;
      background: linear-gradient(to bottom, rgba(232, 255, 41, 0) 0%, rgba(232, 255, 41, 1) 100%);
    }

    /* 90°: horizontal fill left->right */
    #scan-gradient.mode-90 #scan-band {
      top: 0; left: 0; height: 100%; width: 0;
      background: linear-gradient(to right, rgba(232, 255, 41, 0) 0%, rgba(232, 255, 41, 1) 100%);
    }

    /* -90°: horizontal fill right->left */
    #scan-gradient.mode-neg90 #scan-band {
      top: 0; right: 0; height: 100%; width: 0;
      background: linear-gradient(to left, rgba(232, 255, 41, 0) 0%, rgba(232, 255, 41, 1) 100%);
    }

    #ocr-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10vw;
      z-index: 3;
    }

    .scanning-label,
    .search-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: opacity var(--transition-med), transform var(--transition-med);
      will-change: opacity, transform;
    }

    .scanning-label {
      bottom: 24vh;
      opacity: 1;
      text-align: center;
      color: var(--scan-yellow);
      text-shadow: 0 0 16px rgba(0, 0, 0, 0.9);
    }

    #screen-ocr.angle-0 .scanning-label { transform: translateX(-50%) rotate(0deg); }
    #screen-ocr.angle-90 .scanning-label { transform: translateX(-50%) rotate(-90deg); }
    #screen-ocr.angle-neg90 .scanning-label { transform: translateX(-50%) rotate(90deg); }

    #scan-word {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
    }

    #scan-angle {
      margin-top: 0.2em;
      font-size: 2.8rem;
      font-weight: 700;
      opacity: 0.0;
    }

    .search-container {
      bottom: 20vh;
      width: 80vw;
      max-width: 480px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 20px);
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      border-radius: 999px;
      border: none;
      font-size: 1.4rem;
      outline: none;
      background: var(--input-bg);
      color: var(--input-text);
      box-shadow: var(--shadow-soft);
    }

    .autosuggest {
      margin-top: 8px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      color: #111;
      max-height: 40vh;
      overflow-y: auto;
      box-shadow: var(--shadow-soft);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .autosuggest.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .autosuggest-item {
      padding: 12px 18px;
      font-size: 1.4rem;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }
    .autosuggest-item:last-child { border-bottom: none; }
    .autosuggest-item:hover { background: rgba(0, 0, 0, 0.04); }

    #screen-ocr.mode-search .scanning-label {
      opacity: 0;
      transform: translate(-50%, -30px);
      pointer-events: none;
    }
    #screen-ocr.mode-search #scan-gradient { opacity: 0; }
    #screen-ocr.mode-search .search-container {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    #screen-ocr.mode-search #scan-word-overlay { display: none; }

    #ocr-progress {
      display: none !important;
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* CATALOGING OVERLAY */
    #cataloging-overlay {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.58);
      pointer-events: none;
    }

    #cataloging-overlay.visible { display: flex; }

    #cataloging-card {
      width: min(84vw, 420px);
      padding: 24px 26px;
      border-radius: 28px;
      background: rgba(17,17,17,0.94);
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    #cataloging-title {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    #cataloging-status {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 14px;
    }

    #cataloging-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.16);
    }

    #cataloging-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.25s ease;
    }

    /* RESULTS SCREEN */
    #screen-results { inset: 0; background: #000; color: #fff; }

    #results-top-row {
      position: absolute;
      top: 32px;
      left: 20px;
      z-index: 10;
    }

    #btn-new-image {
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    #recognized-title-wrap {
      position: absolute;
      top: 78px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }

    #recognized-title {
      width: min(94vw, 540px);
      min-height: 46px;
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      background: #8d390b;
      color: #fff;
      font-size: 1.25rem;
      line-height: 1.2;
      font-weight: 750;
      text-align: center;
      box-shadow: var(--shadow-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    #recognized-title.is-loading { cursor: default; }
    #recognized-title.is-loading { opacity: 0.72; }
    #recognized-title.is-uncertain { opacity: 0.78; font-weight: 600; }



    #catalog-stats {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 8;
      display: none;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,122,26,0.55);
      color: rgba(255,255,255,0.82);
      font-size: 0.72rem;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    #catalog-stats.visible { display: block; }

    #cataloging-eta {
      margin-top: 8px;
      font-size: 0.9rem;
      opacity: 0.75;
      min-height: 1.1em;
    }

    /* BOOK DETAIL MODAL */

    #search-catalog-stats {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 7;
      display: none;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,122,26,0.55);
      color: rgba(255,255,255,0.82);
      font-size: 0.72rem;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    #screen-ocr.mode-search #search-catalog-stats.visible { display: block; }

    #book-modal-cover-wrap {
      width: 96px;
      min-height: 132px;
      position: relative;
    }
    #book-modal-no-cover {
      width: 96px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: #2a2a2a;
      color: rgba(255,255,255,0.42);
      font-size: 0.72rem;
      text-transform: lowercase;
      letter-spacing: 0.03em;
      box-shadow: 0 7px 18px rgba(0,0,0,0.35);
    }
    #book-modal-no-cover.hidden { display: none; }

    @media (max-width: 420px) {
      #book-modal-cover-wrap { width: 78px; min-height: 108px; }
      #book-modal-no-cover { width: 78px; height: 108px; }
    }

    #book-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 18px;
    }

    #book-modal.visible { display: flex; }

    #book-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.78);
    }

    #book-modal-card {
      position: relative;
      width: min(92vw, 520px);
      max-height: 84vh;
      overflow-y: auto;
      border-radius: 26px;
      background: rgba(20,20,20,0.97);
      border: 2px solid rgba(255,122,26,0.85);
      box-shadow: var(--shadow-soft);
      padding: 22px;
    }

    #book-modal-close {
      position: absolute;
      top: 10px;
      right: 14px;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
    }

    #book-modal-content {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 18px;
      align-items: start;
      padding-right: 14px;
    }

    #book-modal-cover {
      width: 96px;
      min-height: 132px;
      object-fit: cover;
      border-radius: 5px;
      background: #2a2a2a;
      box-shadow: 0 7px 18px rgba(0,0,0,0.35);
    }

    #book-modal-cover.hidden-cover { display: none; }

    #book-modal-info {
      min-width: 0;
    }

    #book-modal-title {
      font-size: 1.5rem;
      line-height: 1.1;
      font-weight: 800;
      margin: 3px 24px 6px 0;
    }

    #book-modal-author {
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .book-meta-row {
      display: flex;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.9rem;
      line-height: 1.3;
    }

    .book-meta-label {
      width: 76px;
      flex: 0 0 76px;
      opacity: 0.55;
    }

    .book-meta-value { min-width: 0; }

    @media (max-width: 420px) {
      #book-modal-content {
        grid-template-columns: 78px 1fr;
        gap: 14px;
      }
      #book-modal-cover { width: 78px; min-height: 108px; }
      #book-modal-title { font-size: 1.3rem; }
    }

    #results-image-wrapper {
      position: absolute;
      inset: 0;
      padding: 126px 0 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #results-image-inner {
      position: relative;
      width: 100%;
      max-width: 560px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #results-image {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
    }

    #highlightsLayer { position: absolute; inset: 0; pointer-events: none; }

    .crosshair-line {
      position: absolute;
      background: linear-gradient(to right, rgba(213, 255, 57, 1) 0%, rgba(213, 255, 57, 0) 100%);
      box-shadow: 0 0 8px rgba(213, 255, 57, 0.7);
      pointer-events: none;
      transform-origin: 0 50%;
    }

    #results-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items:center;
      gap: 14px;
      padding: 0 16px;
      z-index: 10;
    }

    #results-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .pill {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .pill-side {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.25);
      font-size: .8rem;
      max-width: min-content;
    }

    .pill-side.disabled {
      opacity: 0.3;
      border-style: dashed;
      pointer-events: none;
    }

    .pill-main-wrapper {
      flex: 1;
      max-width: 48%;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .pill-main {
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: var(--shadow-soft);
      pointer-events: auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      overflow: visible;
      text-overflow: clip;
      white-space: normal;
    }

    .pill-main-label {
      flex: 1;
      text-align: center;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hit-nav-inline {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      cursor: pointer;
    }

    .hit-nav-inline:disabled { opacity: 0.3; cursor: default; }

    #pill-badge {
      position: absolute;
      top: -30px;
      right: -6px;
      height: 26px;
      min-width: 38px;
      border-radius: 999px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .pill-badge-current, .pill-badge-total {
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pill-badge-current { background: #c62828; color: #fff; }
    .pill-badge-total { background: #fff; color: #111; }

    #results-bottom-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #new-search-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: #583922;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 200;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      width: auto;
      min-width: 44%;
      text-align: center;
    }

    #instance-nav { display: none !important; }

    .hit-nav-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
    }

    #hit-counter {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #fff;
      color: #111;
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* TERM DETAIL MODAL */
    #term-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #term-modal.visible { display: flex; }

    #term-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
    }

    #term-modal-card {
      position: relative;
      width: 86vw;
      max-width: 520px;
      max-height: 80vh;
      border-radius: 24px;
      border: 3px solid var(--accent);
      background: rgba(0, 0, 0, 0.9);
      box-shadow: var(--shadow-soft);
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #term-modal-close {
      position: absolute;
      top: 8px;
      right: 12px;
      border: none;
      background: transparent;
      color: var(--accent);
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
    }

    #term-modal-image-wrapper {
      width: 100%;
      max-height: 60vh;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #term-modal-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    #term-modal-text {
      font-size: 1.4rem;
      font-weight: 500;
      color: var(--accent);
      text-align: center;
    }

    #term-modal-text span { font-weight: 700; }

    @media (min-width: 768px) {
      #term-modal-card { padding: 24px 24px 28px; }
      #term-modal-text { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- ADD IMAGE -->
    <div id="screen-add" class="screen active">
      <input type="file" id="imageInput" accept="image/*" />
      <div class="label">show your<br>bookshelves</div>
    </div>

    <!-- OCR / SCANNING -->
    <div id="screen-ocr" class="screen">
      <div id="ocr-bg"></div>
      <div id="scan-word-overlay"></div>
      <div id="scan-gradient"><div id="scan-band"></div></div>

      <div id="ocr-overlay">
        <div id="ocr-progress" class="hidden">scanning…</div>

        <div class="scanning-label">
          <div id="scan-word">reading</div>
          <div id="scan-angle">0°</div>
        </div>

        <div class="search-container">
          <input id="searchInput" class="search-input" type="text" placeholder="search" autocomplete="off" />
          <div id="autosuggest" class="autosuggest"></div>
        </div>
        <div id="search-catalog-stats"></div>
      </div>

      <div id="cataloging-overlay">
        <div id="cataloging-card">
