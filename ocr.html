  const bookModal = document.getElementById("book-modal");
  const bookModalBackdrop = document.getElementById("book-modal-backdrop");
  const bookModalClose = document.getElementById("book-modal-close");
  const bookModalCover = document.getElementById("book-modal-cover");
  const bookModalNoCover = document.getElementById("book-modal-no-cover");
  const bookModalTitle = document.getElementById("book-modal-title");
  const bookModalAuthor = document.getElementById("book-modal-author");
  const bookModalMeta = document.getElementById("book-modal-meta");

  let ocrWords = [];
  let imageDataUrl = "";
  let sourceCanvas = null; // normalized, color-correct source used for display + bbox coord space
  let sourceDataUrl = "";

  let termList = [];
  let baseOCRTerms = [];
  let geminiRescuedTerms = [];
  let geminiRescueRecords = [];
  let geminiRescueDebug = {
    endpoint: "",
    enabled: false,
    hintsBuilt: 0,
    wordsSent: 0,
    existingTermsSent: 0,
    requestStartedAt: 0,
    elapsedMs: null,
    httpStatus: null,
    httpStatusText: "",
    responseText: "",
    responseJson: null,
    functionError: "",
    model: "",
    rawGeminiRescues: [],
    serverAcceptedRescues: [],
    browserAcceptedRescues: [],
    browserRejectedRescues: []
  };

  // Lightweight text-only OCR rescue. Deploy the supplied Supabase Edge Function as `ocr-rescue`.
  const OCR_RESCUE_ENDPOINT = "https://npjiuowtneivxbgskobd.supabase.co/functions/v1/ocr-rescue";
  const OCR_RESCUE_ENABLED = !OCR_RESCUE_ENDPOINT.includes("YOUR_SUPABASE_FUNCTION_URL");
  const OCR_RESCUE_KEY_STORAGE = "spineless_supabase_public_key";

  function getOCRRescuePublicKey() {
    let key = String(localStorage.getItem(OCR_RESCUE_KEY_STORAGE) || "").trim();
    if (key) return key;
    key = String(window.prompt(
      "Paste the Supabase publishable/anon key for the Spineless project. This is the public browser key, not the service-role key. It will be saved only in this browser."
    ) || "").trim();
    if (key) localStorage.setItem(OCR_RESCUE_KEY_STORAGE, key);
    return key;
  }
  let currentTermIndex = -1;
  let currentTerm = "";

  let currentMatches = [];
  let currentMatchIndex = 0;

  // AI-assisted book recognition test.
  // After deploying the Supabase Edge Function included with this build, paste its URL here.
  // Example: https://YOUR_PROJECT.supabase.co/functions/v1/identify-book
  const BOOK_ID_ENDPOINT = "https://npjiuowtneivxbgskobd.supabase.co/functions/v1/identify-book";
  const BOOK_ID_ENABLED = false; // OCR-only comparison build: never call AI book identification
  console.info("Spineless OCR-only comparison build (ocr.html diagnostic fix)");
  const bookRecognitionCache = new Map();
  let recognitionRequestSerial = 0;
  let bookCatalog = [];
  let aiSpineWords = [];
  const catalogTerms = new Set();
  let catalogingRunSerial = 0;
  let catalogingActive = false;
  let diagnosticRawEntries = [];
  let diagnosticDetectedSpines = [];
  let diagnosticLastElapsed = 0;


  // Dictionary + whitelist sets
  let DICT = null;
  let WHITELIST = null;
  let dictLoaded = false;
  let whitelistLoaded = false;

  const SHORT_COMMON_WORDS = new Set([
    "a","an","as","at","be","by","do","go","he","if","in","is","it","me","my",
    "no","of","on","or","so","to","up","us","we"
  ]);

  function showScreen(el) {
    [screenAdd, screenOCR, screenResults].forEach((s) => s.classList.remove("active"));
    el.classList.add("active");
  }

  async function loadWordLists() {
    try {
      const dictResp = await fetch("dictionary.json");
      if (dictResp.ok) {
        const dictData = await dictResp.json();
        DICT = new Set((dictData || []).map(w => String(w).toLowerCase()));
        dictLoaded = true;
      }
    } catch (e) {
      console.warn("dictionary.json could not be loaded:", e);
    }

    try {
      const wlResp = await fetch("whitelist.json");
      if (wlResp.ok) {
        const wlData = await wlResp.json();
        WHITELIST = new Set((wlData || []).map(w => String(w).toLowerCase()));
        whitelistLoaded = true;
      }
    } catch (e) {
      console.warn("whitelist.json could not be loaded:", e);
    }
  }

  function isCarouselWord(word) {
    if (!word) return false;
    const w = word.toLowerCase();

    if (catalogTerms.has(w)) return true;

    if ((dictLoaded && DICT && DICT.has(w)) ||
        (whitelistLoaded && WHITELIST && WHITELIST.has(w))) {
      return true;
    }

    if (!dictLoaded && !whitelistLoaded) {
      if (SHORT_COMMON_WORDS.has(w)) return true;
      if (!/^[a-z]+$/.test(w)) return false;
      if (w.length < 3) return false;
      if (!/[aeiouy]/.test(w)) return false;
      return true;
    }
    return false;
  }

  function findPrevDictIndex(startIndex) {
    if (!termList.length) return -1;
    let idx = startIndex;
    for (let steps = 0; steps < termList.length; steps++) {
      idx = (idx - 1 + termList.length) % termList.length;
      if (isCarouselWord(termList[idx])) return idx;
    }
    return -1;
  }

  function findNextDictIndex(startIndex) {
    if (!termList.length) return -1;
    let idx = startIndex;
    for (let steps = 0; steps < termList.length; steps++) {
      idx = (idx + 1) % termList.length;
      if (isCarouselWord(termList[idx])) return idx;
    }
    return -1;
  }

  // *** FIXED MAPPING FUNCTION ***
  function mapBboxToOriginal(bbox, kind, W, H) {
    let { x0, y0, x1, y1 } = bbox;

    const corners = [
      [x0, y0], [x1, y0], [x1, y1], [x0, y1],
    ];

    function fromBase(u, v) { return { x: u, y: v }; }
    function fromCW(u, v) { return { x: v, y: H - u }; }   // rotated -> original (CW)
    function fromCCW(u, v) { return { x: W - v, y: u }; }  // rotated -> original (CCW)

    const mapped = corners.map(([u, v]) => {
      if (kind === "base") return fromBase(u, v);
      if (kind === "cw")   return fromCW(u, v);
      return fromCCW(u, v);
    });

    const xs = mapped.map(p => p.x);
    const ys = mapped.map(p => p.y);

    let nx0 = Math.min(...xs), ny0 = Math.min(...ys);
    let nx1 = Math.max(...xs), ny1 = Math.max(...ys);

    nx0 = Math.max(0, Math.min(W, nx0));
    nx1 = Math.max(0, Math.min(W, nx1));
    ny0 = Math.max(0, Math.min(H, ny0));
    ny1 = Math.max(0, Math.min(H, ny1));

    return { x0: nx0, y0: ny0, x1: nx1, y1: ny1 };
  }

  /* ==========================
     SCANNING WORD PULSES
     ========================== */

  let scanPulseTimer = null;
  let scanPulseActive = false;
  let scanPulsePool = [];
  let scanPulseDims = { W: 0, H: 0 };

  function clearScanWordOverlay() {
    if (!scanWordOverlay) return;
    while (scanWordOverlay.firstChild) scanWordOverlay.removeChild(scanWordOverlay.firstChild);
  }

  function sanitizePulseText(raw) {
    const clean = String(raw || "")
      .trim()
      .replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "")
      .trim();
    if (!clean) return "";
    if (clean.length < 3) return "";
    if (clean.length > 18) return "";
    if (!/^[a-z0-9]+$/i.test(clean)) return "";
    return clean.toLowerCase();
  }

  function showFloatingWord(wordObj) {
    if (!scanWordOverlay) return;
    if (!wordObj || !wordObj.text || !wordObj.bbox) return;
    if (!screenOCR.classList.contains("active")) return;
    if (screenOCR.classList.contains("mode-search")) return;

    const text = sanitizePulseText(wordObj.text);
    if (!text) return;

    const { W, H } = scanPulseDims;
    if (!W || !H) return;

    const bbox = wordObj.bbox;
    const cx = ((bbox.x0 + bbox.x1) / 2) / W;
    const cy = ((bbox.y0 + bbox.y1) / 2) / H;

    const px = Math.max(0.06, Math.min(0.94, cx)) * 100;
    const py = Math.max(0.10, Math.min(0.90, cy)) * 100;

    const el = document.createElement("div");
    el.className = "scan-float-word";
    el.textContent = text;

    // font size scales a bit with word length
    const len = text.length;
    const vh = Math.max(9, Math.min(16, 14 + (10 - Math.min(len, 10)) * 0.6));
    el.style.fontSize = `min(${vh}vh, 96px)`;

    el.style.left = `${px}%`;
    el.style.top  = `${py}%`;

    scanWordOverlay.appendChild(el);
    setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, 1200);
  }

  function pickPulseCandidate() {
    if (!scanPulsePool.length) return null;

    // random tries for a solid candidate
    for (let tries = 0; tries < 14; tries++) {
      const w = scanPulsePool[(Math.random() * scanPulsePool.length) | 0];
      if (!w || !w.text) continue;
      if (typeof w.confidence === "number" && w.confidence < 35) continue;
      if (!sanitizePulseText(w.text)) continue;
      return w;
    }
    return scanPulsePool[(Math.random() * scanPulsePool.length) | 0] || null;
  }

  function scheduleNextPulse() {
    if (!scanPulseActive) return;

    // SHORTER interval so it’s visible even on fast devices
    const delay = 600 + Math.random() * 800; // 0.6s – 1.4s

    scanPulseTimer = setTimeout(() => {
      if (!scanPulseActive) return;
      if (screenOCR.classList.contains("mode-search")) return;

      const candidate = pickPulseCandidate();
      if (candidate) showFloatingWord(candidate);

      scheduleNextPulse();
    }, delay);
  }

  function startScanPulses(W, H) {
    stopScanPulses();
    scanPulseActive = true;
    scanPulsePool = [];
    scanPulseDims = { W, H };
    clearScanWordOverlay();

    // kick one early (it’ll no-op until pool has words)
    scheduleNextPulse();
  }

  function stopScanPulses() {
    scanPulseActive = false;
    if (scanPulseTimer) {
      clearTimeout(scanPulseTimer);
      scanPulseTimer = null;
    }
    clearScanWordOverlay();
    scanPulsePool = [];
  }

  /* ========================== */

  imageInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      imageDataUrl = ev.target.result;
      startOCR(imageDataUrl);
    };
    reader.readAsDataURL(file);
  });

  function extractCatalogTokens(textValue) {
    return String(textValue || "")
      .toLowerCase()
      .replace(/['’]/g, "")
      .split(/[^a-z0-9]+/g)
      .map(t => t.trim())
      .filter(t => t.length >= 3 && /[a-z]/.test(t));
  }

  function rebuildCatalogTerms() {
    catalogTerms.clear();
    for (const entry of bookCatalog) {
      if (!entry || !entry.result) continue;
      const tokens = [
        ...extractCatalogTokens(entry.result.title),
        ...extractCatalogTokens(entry.result.author)
      ];
      for (const token of tokens) catalogTerms.add(token);
    }
  }

  function buildTermList() {
    const cleaned = ocrWords
      .map(w => (w.text || "").trim())
      .filter(Boolean)
      .map(t => t.toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "").trim())
      .filter(t => t.length > 1);

    baseOCRTerms = Array.from(new Set(cleaned)).sort((a, b) => a.localeCompare(b));

    const aiCleaned = aiSpineWords
      .map(w => normalizeToken(w.text))
      .filter(t => t.length > 1);

    rebuildCatalogTerms();
    termList = Array.from(new Set([...baseOCRTerms, ...geminiRescuedTerms, ...aiCleaned, ...catalogTerms]))
      .sort((a, b) => a.localeCompare(b));
  }

  function editDistance(a, b) {
    a = String(a || ""); b = String(b || "");
    const prev = Array.from({length: b.length + 1}, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(
          cur[j - 1] + 1,
          prev[j] + 1,
          prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
      for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
    }
    return prev[b.length];
  }

  function similarity(a, b) {
    a = String(a || "").toLowerCase();
    b = String(b || "").toLowerCase();
    const n = Math.max(a.length, b.length);
    return n ? 1 - editDistance(a, b) / n : 1;
  }

  function metadataTokens(doc) {
    const values = [doc?.title || "", ...(doc?.author_name || []), ...(doc?.publisher || []).slice(0, 4)];
    return Array.from(new Set(values.flatMap(v => String(v).toLowerCase().split(/[^a-z0-9]+/g))
      .filter(t => t.length >= 4 && /^[a-z][a-z0-9]*$/.test(t))));
  }

  function cleanOCRClusterToken(raw) {
    return String(raw || "")
      .toLowerCase()
      .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
      .trim();
  }

  function bboxMetrics(word) {
    const b = word?.bbox || {};
    const x0 = Number(b.x0 ?? b.left ?? 0), y0 = Number(b.y0 ?? b.top ?? 0);
    const x1 = Number(b.x1 ?? b.right ?? x0), y1 = Number(b.y1 ?? b.bottom ?? y0);
    return { x0, y0, x1, y1, w: Math.max(1, x1-x0), h: Math.max(1, y1-y0), cx:(x0+x1)/2, cy:(y0+y1)/2 };
  }

  function makeSpatialOCRClusters() {
    const W = sourceCanvas?.width || 1650;
    const H = sourceCanvas?.height || 2200;
    const usable = (ocrWords || []).map((w, idx) => ({
      word: w,
      idx,
      term: cleanOCRClusterToken(w?.text),
      confidence: Number(w?.confidence || 0),
      pass: w?.ocrPass || "?",
      box: bboxMetrics(w)
    })).filter(x => x.term.length >= 3 && x.term.length <= 20 && /^[a-z][a-z0-9]*$/.test(x.term) && x.confidence >= 18);

    const clusters = [];
    const seen = new Set();
    const maxHorizontalGap = Math.max(42, W * 0.035);
    const maxVerticalGap = Math.max(42, H * 0.025);

    for (const a of usable) {
      const neighbors = usable.filter(b => {
        if (a === b || a.pass !== b.pass) return false;
        const sameVerticalTrack = Math.abs(a.box.cx - b.box.cx) <= Math.max(34, Math.min(65, (a.box.w + b.box.w) * 0.9));
        const vgap = Math.max(0, Math.max(a.box.y0,b.box.y0) - Math.min(a.box.y1,b.box.y1));
        const sameHorizontalTrack = Math.abs(a.box.cy - b.box.cy) <= Math.max(24, Math.min(50, (a.box.h + b.box.h) * 0.9));
        const hgap = Math.max(0, Math.max(a.box.x0,b.box.x0) - Math.min(a.box.x1,b.box.x1));
        return (sameVerticalTrack && vgap <= maxVerticalGap) || (sameHorizontalTrack && hgap <= maxHorizontalGap);
      });

      if (!neighbors.length) continue;
      const group = [a, ...neighbors]
        .sort((x,y) => {
          const vertical = Math.abs(a.box.h - a.box.w) > 8 || Math.abs(x.box.h - x.box.w) > 8;
          return vertical ? (x.box.y0-y.box.y0 || x.box.x0-y.box.x0) : (x.box.x0-y.box.x0 || x.box.y0-y.box.y0);
        })
        .slice(0,4);

      const terms = Array.from(new Set(group.map(x => x.term)));
      if (terms.length < 2) continue;
      const key = terms.slice().sort().join("|") + "|" + a.pass;
      if (seen.has(key)) continue;
      seen.add(key);
      clusters.push({
        terms,
        phrase: terms.join(" "),
        confidence: group.reduce((n,x)=>n+x.confidence,0)/group.length,
        pass: a.pass,
        members: group
      });
    }

    // Prefer clusters with a strong word plus a suspicious/non-dictionary companion.
    return clusters.map(c => {
      const unknowns = c.terms.filter(t => !isCarouselWord(t));
      const knowns = c.terms.filter(t => isCarouselWord(t));
      c.priority = unknowns.length * 3 + knowns.length + c.confidence/40 + c.terms.join("").length/20;
      return c;
    }).filter(c => c.terms.some(t => !isCarouselWord(t)))
      .sort((a,b)=>b.priority-a.priority)
      .slice(0,24);
  }

  function buildOCRRescueHints() {
    // Keep enough noisy context to let Gemini use spatial relationships, while avoiding
    // thousands of punctuation-only Tesseract fragments.
    const hints = [];
    for (const w of (ocrWords || [])) {
      if (!w || !w.text || !w.bbox) continue;
      const raw = String(w.text).trim();
      const letters = raw.replace(/[^A-Za-z0-9]/g, "");
      const confidence = Number.isFinite(Number(w.confidence)) ? Number(w.confidence) : 0;
      if (letters.length < 2 || letters.length > 28) continue;
      if (confidence < 18) continue;
      hints.push({
        text: raw,
        confidence: Math.round(confidence),
        pass: w.ocrPass || "?",
        bbox: {
          x0: Math.round(w.bbox.x0 || 0),
          y0: Math.round(w.bbox.y0 || 0),
          x1: Math.round(w.bbox.x1 || 0),
          y1: Math.round(w.bbox.y1 || 0)
        }
      });
    }
    // Preserve image order; the bbox remains available for vertical/horizontal grouping.
    hints.sort((a,b) => a.bbox.y0-b.bbox.y0 || a.bbox.x0-b.bbox.x0);
    return hints.slice(0, 900);
  }

  function normalizeRescueTerm(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[’']/g, "")
      .replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, "")
      .trim();
  }

  async function rescueTermsWithGemini() {
    geminiRescuedTerms = [];
    geminiRescueRecords = [];
    geminiRescueDebug = {
      endpoint: OCR_RESCUE_ENDPOINT,
      enabled: OCR_RESCUE_ENABLED,
      hintsBuilt: 0,
      wordsSent: 0,
      existingTermsSent: Array.isArray(baseOCRTerms) ? baseOCRTerms.length : 0,
      requestStartedAt: 0,
      elapsedMs: null,
      httpStatus: null,
      httpStatusText: "",
      responseText: "",
      responseJson: null,
      functionError: "",
      model: "",
      rawGeminiRescues: [],
      serverAcceptedRescues: [],
      browserAcceptedRescues: [],
      browserRejectedRescues: []
    };

    if (!OCR_RESCUE_ENABLED) {
      geminiRescueDebug.functionError = "OCR rescue endpoint disabled";
      buildTermList();
      return;
    }

    const hints = buildOCRRescueHints();
    geminiRescueDebug.hintsBuilt = hints.length;
    geminiRescueDebug.wordsSent = hints.length;
    if (!hints.length) {
      geminiRescueDebug.functionError = "No OCR hints survived client-side hint filtering";
      buildTermList();
      return;
    }

    try {
      geminiRescueDebug.requestStartedAt = Date.now();
      const publicKey = getOCRRescuePublicKey();
      if (!publicKey) {
        geminiRescueDebug.functionError = "Supabase public key not supplied; Gemini rescue was not called";
        buildTermList();
        return;
      }
      const resp = await fetch(OCR_RESCUE_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": publicKey,
          "Authorization": `Bearer ${publicKey}`
        },
        body: JSON.stringify({
          imageWidth: sourceCanvas ? sourceCanvas.width : null,
          imageHeight: sourceCanvas ? sourceCanvas.height : null,
          existingTerms: baseOCRTerms,
          ocrWords: hints,
          debug: true
        })
      });
      geminiRescueDebug.elapsedMs = Date.now() - geminiRescueDebug.requestStartedAt;
      geminiRescueDebug.httpStatus = resp.status;
      geminiRescueDebug.httpStatusText = resp.statusText || "";

      const responseText = await resp.text();
      geminiRescueDebug.responseText = responseText;
      let data = null;
      try { data = responseText ? JSON.parse(responseText) : null; } catch (_) {}
      geminiRescueDebug.responseJson = data;

      if (!resp.ok) {
        const detail = data ? JSON.stringify(data) : responseText;
        throw new Error(`OCR rescue failed (${resp.status}) ${detail}`);
      }

      geminiRescueDebug.model = String(data?.model || data?.debug?.model || "");
      geminiRescueDebug.functionError = String(data?.error || data?.debug?.error || "");
      geminiRescueDebug.rawGeminiRescues = Array.isArray(data?.debug?.rawGeminiRescues)
        ? data.debug.rawGeminiRescues
        : [];
      geminiRescueDebug.serverAcceptedRescues = Array.isArray(data?.rescues) ? data.rescues : [];

      const records = Array.isArray(data?.rescues) ? data.rescues : [];
      const rescued = new Set();

      for (const r of records) {
        const rejectedReasons = [];
        const confidence = Number(r?.confidence || 0);
        if (confidence < 0.70) rejectedReasons.push(`confidence ${confidence} < 0.70`);
        const sources = Array.isArray(r?.sources) ? r.sources.map(v => String(v)).filter(Boolean).slice(0,6) : [];
        const terms = Array.isArray(r?.terms) ? r.terms : [];
        const accepted = [];
        const rejectedTerms = [];
        for (const raw of terms) {
          const term = normalizeRescueTerm(raw);
          let reason = "";
          if (!term || term.length < 3 || term.length > 30) reason = "bad length/empty";
          else if (!/^[a-z0-9-]+$/.test(term)) reason = "invalid characters";
          else if (baseOCRTerms.includes(term)) reason = "already in OCR terms";
          if (reason) rejectedTerms.push({ raw: String(raw), normalized: term, reason });
          else {
            rescued.add(term);
            accepted.push(term);
          }
        }
        if (confidence < 0.70 || !accepted.length) {
          geminiRescueDebug.browserRejectedRescues.push({
            sources, terms, confidence,
            reason: String(r?.reason || ""),
            rejectedReasons,
            rejectedTerms
          });
          continue;
        }
        const acceptedRecord = {
          sources,
          terms: accepted,
          confidence,
          reason: String(r?.reason || "").trim()
        };
        geminiRescueRecords.push(acceptedRecord);
        geminiRescueDebug.browserAcceptedRescues.push(acceptedRecord);
      }

      geminiRescuedTerms = Array.from(rescued).sort((a,b)=>a.localeCompare(b));
    } catch (err) {
      geminiRescueDebug.elapsedMs = geminiRescueDebug.elapsedMs ?? (geminiRescueDebug.requestStartedAt ? Date.now() - geminiRescueDebug.requestStartedAt : null);
      geminiRescueDebug.functionError = err instanceof Error ? err.message : String(err);
      console.warn("Gemini OCR rescue failed:", err);
    }
    buildTermList();
  }

  function setScanMode(angleLabel, modeClass) {
    screenOCR.classList.add("scanning");
    scanGradient.style.opacity = "1";
    scanGradient.classList.remove("mode-0", "mode-90", "mode-neg90");
    if (modeClass) scanGradient.classList.add(modeClass);

    screenOCR.classList.remove("angle-0", "angle-90", "angle-neg90");
    if (modeClass === "mode-0") screenOCR.classList.add("angle-0");
    else if (modeClass === "mode-90") screenOCR.classList.add("angle-90");
    else if (modeClass === "mode-neg90") screenOCR.classList.add("angle-neg90");

    scanWordEl.textContent = "reading";
    scanAngleEl.textContent = angleLabel;
    updateScanProgress(0);
  }

  function updateScanProgress(progress) {
    const p = Math.max(0, Math.min(1, progress || 0));

    if (scanGradient.classList.contains("mode-0")) {
      scanBand.style.width = "100%";
      scanBand.style.height = (p * 100) + "%";
      scanBand.style.top = "0";
      scanBand.style.left = "0";
      scanBand.style.right = "auto";
    } else if (scanGradient.classList.contains("mode-90")) {
      scanBand.style.height = "100%";
      scanBand.style.width = (p * 100) + "%";
      scanBand.style.left = "0";
      scanBand.style.right = "auto";
    } else if (scanGradient.classList.contains("mode-neg90")) {
      scanBand.style.height = "100%";
      scanBand.style.width = (p * 100) + "%";
      scanBand.style.right = "0";
      scanBand.style.left = "auto";
    }
  }

  function applyGrayscaleAndContrast(canvas, contrastValue = 20) {
    const ctx = canvas.getContext("2d");
    const { width, height } = canvas;
    if (!width || !height) return;

    const imageData = ctx.getImageData(0, 0, width, height);
    const data = imageData.data;

    const c = contrastValue;
    const factor = (259 * (c + 255)) / (255 * (259 - c));

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      let gray = 0.299 * r + 0.587 * g + 0.114 * b;
      gray = factor * (gray - 128) + 128;
      gray = Math.max(0, Math.min(255, gray));
      data[i] = gray; data[i + 1] = gray; data[i + 2] = gray;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  async function startOCR(dataUrl) {
    showScreen(screenOCR);
    screenOCR.classList.remove("mode-search");
    ocrBg.style.backgroundImage = `url(${dataUrl})`;
    ocrProgress.classList.remove("hidden");
    ocrProgress.textContent = "scanning…";

    ocrWords = [];
    termList = [];
    baseOCRTerms = [];
    geminiRescuedTerms = [];
    geminiRescueRecords = [];
    currentTermIndex = -1;
    currentTerm = "";
    currentMatches = [];
    currentMatchIndex = 0;
    clearHighlights();
    pillMainLabel.textContent = "";
    pillLeft.textContent = "";
    pillRight.textContent = "";
    pillLeft.classList.add("disabled");
    pillRight.classList.add("disabled");
    pillBadge.classList.add("hidden");
    pillBadge.innerHTML = "";
    hitPrevInline.disabled = true;
    hitNextInline.disabled = true;
    hitPrevInline.classList.add("hidden");
    hitNextInline.classList.add("hidden");
    setRecognizedTitle("");
    bookRecognitionCache.clear();
    bookCatalog = [];
    aiSpineWords = [];
    diagnosticRawEntries = [];
    diagnosticDetectedSpines = [];
    diagnosticLastElapsed = 0;
    if (catalogStats) catalogStats.classList.remove("visible");
    if (searchCatalogStats) searchCatalogStats.classList.remove("visible");
    recognitionRequestSerial++;
    catalogingRunSerial++;
    catalogingActive = false;
    if (catalogingOverlay) catalogingOverlay.classList.remove("visible");
    if (catalogingBar) catalogingBar.style.width = "0%";

    stopScanPulses();

    try {
      const img = new Image();
      img.src = dataUrl;

      await new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error("Could not load image for OCR"));
      });

      // Normalize into a single, stable pixel coordinate space.
      // We use this same normalized canvas for:
      //  - results display (so what you *see* matches what OCR analyzed)
      //  - bbox coordinates (so mapping never depends on EXIF/canvas quirks)
      const W0 = img.naturalWidth;
      const H0 = img.naturalHeight;

      const MAX_DIM = 2200; // keep OCR fast/stable on mobile
      const scale = Math.min(1, MAX_DIM / Math.max(W0, H0));
      const W = Math.max(1, Math.round(W0 * scale));
      const H = Math.max(1, Math.round(H0 * scale));

      // Source canvas (color) used for display + cropping.
      sourceCanvas = document.createElement("canvas");
      sourceCanvas.width = W;
      sourceCanvas.height = H;
      sourceCanvas.getContext("2d").drawImage(img, 0, 0, W, H);

      // Use the normalized image everywhere in the UI.
      sourceDataUrl = sourceCanvas.toDataURL("image/jpeg", 0.92);
      imageDataUrl = sourceDataUrl;
      ocrBg.style.backgroundImage = `url(${sourceDataUrl})`;

// start pulse loop immediately (words will start once pool fills)
      startScanPulses(W, H);

      const baseCanvas = document.createElement("canvas");
      baseCanvas.width = W;
      baseCanvas.height = H;
      baseCanvas.getContext("2d").drawImage(sourceCanvas, 0, 0);

      const cwCanvas = document.createElement("canvas");
      cwCanvas.width = H;
      cwCanvas.height = W;
      const ctxCW = cwCanvas.getContext("2d");
      ctxCW.translate(H, 0);
      ctxCW.rotate(Math.PI / 2);
      ctxCW.drawImage(sourceCanvas, 0, 0);

      const ccwCanvas = document.createElement("canvas");
      ccwCanvas.width = H;
      ccwCanvas.height = W;
      const ctxCCW = ccwCanvas.getContext("2d");
      ctxCCW.translate(0, W);
      ctxCCW.rotate(-Math.PI / 2);
      ctxCCW.drawImage(sourceCanvas, 0, 0);

      applyGrayscaleAndContrast(baseCanvas, 20);
      applyGrayscaleAndContrast(cwCanvas, 20);
      applyGrayscaleAndContrast(ccwCanvas, 20);

      const passes = [
        { kind: "base", canvas: baseCanvas, label: "0°",   modeClass: "mode-0" },
        { kind: "cw",   canvas: cwCanvas,   label: "90°",  modeClass: "mode-90" },
        { kind: "ccw",  canvas: ccwCanvas,  label: "-90°", modeClass: "mode-neg90" },
      ];

      let allWords = [];

      for (let i = 0; i < passes.length; i++) {
        const { kind, canvas, label, modeClass } = passes[i];
        const passIndex = i + 1;
        const passTotal = passes.length;

        setScanMode(label, modeClass);

        const result = await Tesseract.recognize(canvas, "eng", {
          logger: (m) => {
            if (m.status === "recognizing text") {
              const pct = Math.round((m.progress || 0) * 100);
              ocrProgress.textContent = `reading ${label}  ${passIndex}/${passTotal}… ${pct}%`;
              updateScanProgress(m.progress || 0);
            } else {
              ocrProgress.textContent = `reading ${label}  ${passIndex}/${passTotal}…`;
            }
          },
        });

        updateScanProgress(1);

        const words = result.data.words || [];

        const mapped = words
          .map((w) => {
            if (!w.text || !w.text.trim().length) return null;

            const confidence =
              typeof w.confidence === "number"
                ? w.confidence
                : typeof w.conf === "number"
                ? w.conf
                : null;

            if (typeof confidence === "number" && confidence < 10) return null;

            return {
              text: w.text.trim(),
              bbox: mapBboxToOriginal(w.bbox, kind, W, H),
              confidence,
              ocrPass: label,
              ocrPassKind: kind,
            };
          })
          .filter(Boolean);

        allWords = allWords.concat(mapped);

        // feed pulse pool as each pass completes (bounded)
        scanPulsePool = scanPulsePool.concat(mapped).slice(-1200);

        // IMPORTANT: guaranteed visible pulse right now (so you see it even if OCR is fast)
        const immediate = pickPulseCandidate();
        if (immediate) showFloatingWord(immediate);
      }

      scanGradient.style.opacity = "0";

      ocrWords = allWords;
      buildTermList();
      ocrProgress.textContent = "cleaning OCR with Gemini…";
      await rescueTermsWithGemini();
      ocrProgress.classList.add("hidden");

      // stop pulses once search UI appears
      stopScanPulses();

      // OCR-only comparison build: skip AI/Gemini cataloging entirely.
      screenOCR.classList.add("mode-search");
      setTimeout(() => searchInput.focus(), 450);
    } catch (err) {
      console.error(err);
      stopScanPulses();
      alert(
        "There was a problem reading the image.\n\n" +
          (err && err.message ? err.message : String(err))
      );
      scanGradient.style.opacity = "0";
      showScreen(screenAdd);
    }
  }

  function updateAutosuggest(query) {
    const trimmed = query.trim();
    if (!trimmed || trimmed.length < 3) {
      autosuggestEl.classList.remove("visible");
      autosuggestEl.innerHTML = "";
      return;
    }

    const q = trimmed.toLowerCase();
    const suggestions = termList.filter(t => t.startsWith(q)).slice(0, 20);

    if (!suggestions.length) {
      autosuggestEl.classList.remove("visible");
      autosuggestEl.innerHTML = "";
      return;
    }

    autosuggestEl.innerHTML = suggestions
      .map(s => `<div class="autosuggest-item" data-value="${s}">${s}</div>`)
      .join("");
    autosuggestEl.classList.add("visible");
  }

  searchInput.addEventListener("input", (e) => updateAutosuggest(e.target.value));
  searchInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const term = e.target.value.trim();
      if (term) runSearch(term);
    }
  });

  autosuggestEl.addEventListener("click", (e) => {
    const item = e.target.closest(".autosuggest-item");
    if (!item) return;
    const value = item.dataset.value;
    searchInput.value = value;
    autosuggestEl.classList.remove("visible");
    runSearch(value);
  });

  function normalizeToken(t) {
    return (t || "").toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9]+$/gi, "").trim();
  }

  function getMatchesForTerm(term) {
    const q = normalizeToken(term);
    if (!q) return [];

    const matches = [];
    const seen = new Set();

    // Original OCR-derived matches.
    for (const w of ocrWords) {
      const token = normalizeToken(w.text);
      const hit = q.length <= 2 ? token === q : token.includes(q);
      if (!hit || !w.bbox) continue;
      const key = `${Math.round(w.bbox.x0)}|${Math.round(w.bbox.y0)}|${Math.round(w.bbox.x1)}|${Math.round(w.bbox.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push(w);
      }
    }

    // AI-read literal spine text, including books the model could not identify.
    for (const w of aiSpineWords) {
      const token = normalizeToken(w.text);
      const hit = q.length <= 2 ? token === q : token.includes(q);
      if (!hit || !w.bbox) continue;
      const key = `${Math.round(w.bbox.x0)}|${Math.round(w.bbox.y0)}|${Math.round(w.bbox.x1)}|${Math.round(w.bbox.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push(w);
      }
    }

    // Catalog-derived title/author terms. These let Spineless find words Tesseract never read.
    for (const entry of bookCatalog) {
      if (!entry || !entry.match || !entry.match.bbox || !entry.result) continue;
      const tokens = [
        ...extractCatalogTokens(entry.result.title),
        ...extractCatalogTokens(entry.result.author)
      ];
      if (!tokens.includes(q)) continue;

      const b = entry.match.bbox;
      const key = `${Math.round(b.x0)}|${Math.round(b.y0)}|${Math.round(b.x1)}|${Math.round(b.y1)}`;
      if (!seen.has(key)) {
        seen.add(key);
        matches.push({
          ...entry.match,
          text: q,
          catalogEntry: entry,
          confidence: Math.max(Number(entry.result.confidence || 0) * 100, Number(entry.match.confidence || 0))
        });
      }
    }

    return matches;
  }

  function runSearch(term) {
    if (!ocrWords.length || !termList.length) return;

    const raw = term.trim();
    if (!raw) return;

    const q = normalizeToken(raw);
    if (!q) { alert(`No matches found for “${raw}”`); return; }

    let idx = termList.findIndex(t => t === q);
    if (idx === -1) idx = termList.findIndex(t => t.startsWith(q));
    if (idx === -1 && q.length >= 3) idx = termList.findIndex(t => t.includes(q));

    if (idx === -1) { alert(`No matches found for “${raw}”`); return; }

    currentTermIndex = idx;
    currentTerm = termList[currentTermIndex];

    currentMatches = getMatchesForTerm(currentTerm);
    currentMatchIndex = 0;

    setupResultsScreen();
    showScreen(screenResults);
    drawHighlightsForTerm(currentTerm, currentMatchIndex);
  }

  function truncateLabel(text, maxLen) {
    if (!text) return "";
    if (text.length <= maxLen) return text;
    return text.slice(0, maxLen - 1) + "…";
  }

  function updateInstanceNav() {
    if (!currentMatches || currentMatches.length <= 1) {
      pillBadge.classList.add("hidden");
      pillBadge.innerHTML = "";
      hitPrevInline.disabled = true;
      hitNextInline.disabled = true;
      hitPrevInline.classList.add("hidden");
      hitNextInline.classList.add("hidden");
      return;
    }
    const current = currentMatchIndex + 1;
    const total = currentMatches.length;
    pillBadge.classList.remove("hidden");
    pillBadge.innerHTML =
      `<span class="pill-badge-current">${current}</span>` +
      `<span class="pill-badge-total">${total}</span>`;
    hitPrevInline.disabled = false;
    hitNextInline.disabled = false;
    hitPrevInline.classList.remove("hidden");
    hitNextInline.classList.remove("hidden");
  }

  function setRecognizedTitle(text, state = "") {
    if (!recognizedTitle || !recognizedTitleWrap) return;
    recognizedTitle.classList.remove("is-loading", "is-uncertain");
    if (!text) {
      recognizedTitle.textContent = "";
      recognizedTitleWrap.classList.add("hidden");
      return;
    }
    recognizedTitle.textContent = text;
    if (state) recognizedTitle.classList.add(state);
    recognizedTitleWrap.classList.remove("hidden");
  }

  function bboxCenter(b) {
    return { x: (b.x0 + b.x1) / 2, y: (b.y0 + b.y1) / 2 };
  }

  function buildRecognitionContext(match) {
    if (!sourceCanvas || !match || !match.bbox) return null;
    const b = match.bbox;
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const c = bboxCenter(b);

    // Send the whole shelf image so the vision model can infer the actual book boundaries.
    // We draw a conspicuous marker around the OCR hit so the model knows exactly which
    // word/spine the user selected without relying only on coordinate math.
    const maxDim = 1600;
    const scale = Math.min(1, maxDim / Math.max(W, H));
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(W * scale));
    canvas.height = Math.max(1, Math.round(H * scale));
    const ctx = canvas.getContext("2d");
    ctx.drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);

    const sx = canvas.width / W;
    const sy = canvas.height / H;
    const x = b.x0 * sx;
    const y = b.y0 * sy;
    const bw = Math.max(2, (b.x1 - b.x0) * sx);
    const bh = Math.max(2, (b.y1 - b.y0) * sy);
    const pad = Math.max(8, Math.min(24, Math.max(bw, bh) * 0.35));

    ctx.save();
    ctx.strokeStyle = "#ff2d2d";
    ctx.lineWidth = Math.max(5, Math.round(Math.min(canvas.width, canvas.height) / 180));
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 8;
    ctx.strokeRect(
      Math.max(1, x - pad),
      Math.max(1, y - pad),
      Math.min(canvas.width - x + pad - 1, bw + pad * 2),
      Math.min(canvas.height - y + pad - 1, bh + pad * 2)
    );
    ctx.restore();

    // Gather OCR context primarily by physical proximity to the selected word.
    // This is only a hint; the model gets the full image and can read the rest itself.
    const nearby = ocrWords
      .filter(w => w && w.bbox)
      .map(w => ({
        text: normalizeToken(w.text),
        confidence: typeof w.confidence === "number" ? w.confidence : 0,
        d: Math.hypot(bboxCenter(w.bbox).x - c.x, bboxCenter(w.bbox).y - c.y)
      }))
      .filter(w => w.text && w.text.length > 1)
      .sort((a,b) => (a.d - b.d) || (b.confidence - a.confidence));

    const contextWords = [];
    for (const w of nearby) {
      if (!contextWords.includes(w.text)) contextWords.push(w.text);
      if (contextWords.length >= 12) break;
    }

    return {
      image: canvas.toDataURL("image/jpeg", 0.90),
      contextWords,
      target: {
        x0: b.x0 / W,
        y0: b.y0 / H,
        x1: b.x1 / W,
        y1: b.y1 / H,
        centerX: c.x / W,
        centerY: c.y / H
      }
    };
  }

  async function searchOpenLibraryCandidates(searchTerm, contextWords) {
    const queries = [];
    const strongContext = (contextWords || []).filter(w => w.length >= 3 && w !== searchTerm).slice(0, 4);
    if (strongContext.length) queries.push([searchTerm, ...strongContext].join(" "));
    queries.push(searchTerm);

    const merged = new Map();
    for (const q of queries) {
      try {
        const params = new URLSearchParams({
          q,
          fields: "key,title,author_name,first_publish_year,edition_key,cover_i,isbn,publisher",
          limit: "12"
        });
        const resp = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
        if (!resp.ok) continue;
        const data = await resp.json();
        for (const doc of (data.docs || [])) {
          if (!doc.title) continue;
          const key = doc.key || `${doc.title}|${(doc.author_name || [""])[0]}`;
          if (merged.has(key)) continue;
          merged.set(key, {
            key: doc.key || null,
            title: doc.title,
            author: (doc.author_name || []).slice(0, 3).join(", "),
            year: doc.first_publish_year || null,
            cover_i: doc.cover_i || null,
            isbn: (doc.isbn || []).slice(0, 4),
            publisher: (doc.publisher || []).slice(0, 3),
            edition_key: (doc.edition_key || []).slice(0, 4)
          });
          if (merged.size >= 12) break;
        }
      } catch (err) {
        console.warn("Open Library candidate lookup failed:", err);
      }
      if (merged.size >= 12) break;
    }
    return Array.from(merged.values()).slice(0, 12);
  }

  function recognitionCacheKey(match, term = currentTerm) {
    if (!match || !match.bbox) return "";
    const b = match.bbox;
    return [term || "", Math.round(b.x0), Math.round(b.y0), Math.round(b.x1), Math.round(b.y1)].join("|");
  }

  function normalizedDistanceBetweenMatches(a, b) {
    if (!sourceCanvas || !a || !b || !a.bbox || !b.bbox) return Infinity;
    const ca = bboxCenter(a.bbox), cb = bboxCenter(b.bbox);
    const dx = (ca.x - cb.x) / sourceCanvas.width;
    const dy = (ca.y - cb.y) / sourceCanvas.height;
    return Math.hypot(dx, dy);
  }

  function findCatalogEntryForMatch(match) {
    if (!match || !bookCatalog.length) return null;
    let best = null, bestD = Infinity;
    for (const entry of bookCatalog) {
      const d = normalizedDistanceBetweenMatches(match, entry.match);
      if (d < bestD) { bestD = d; best = entry; }
    }
    // Tight enough to usually mean the same physical book, but forgiving of different OCR words on it.
    return bestD <= 0.045 ? best : null;
  }

  async function identifyMatch(match, searchTerm, options = {}) {
    if (!BOOK_ID_ENABLED || !match || !sourceCanvas) return null;
    const { updateUI = false, serial = null } = options;

    const existingCatalog = findCatalogEntryForMatch(match);
    if (existingCatalog && existingCatalog.result && existingCatalog.result.title !== "Unknown title") {
      return existingCatalog.result;
    }

    const cacheKey = recognitionCacheKey(match, searchTerm);
    if (bookRecognitionCache.has(cacheKey)) return bookRecognitionCache.get(cacheKey);

    if (updateUI) setRecognizedTitle("identifying…", "is-loading");
    const recognitionContext = buildRecognitionContext(match);
    if (!recognitionContext) return null;

    const candidates = await searchOpenLibraryCandidates(searchTerm, recognitionContext.contextWords);
    if (serial !== null && serial !== recognitionRequestSerial) return null;

    try {
      const resp = await fetch(BOOK_ID_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: recognitionContext.image,
          searchTerm,
          ocrWords: recognitionContext.contextWords,
          target: recognitionContext.target,
          candidates
        })
      });
      if (!resp.ok) {
        let detail = "";
        try { detail = JSON.stringify(await resp.json()); } catch (_) { detail = await resp.text(); }
        throw new Error(`Book identification failed (${resp.status}) ${detail}`);
      }
      const result = await resp.json();
      const candidateIndex = Number.isFinite(Number(result && result.candidateIndex)) ? Number(result.candidateIndex) : -1;
      const matchedCandidate = candidateIndex >= 0 && candidateIndex < candidates.length ? candidates[candidateIndex] : null;
      const clean = {
        title: result && result.title ? String(result.title) : "Unknown title",
        author: result && result.author ? String(result.author) : "",
        confidence: Number.isFinite(Number(result && result.confidence)) ? Number(result.confidence) : 0,
        candidateIndex,
        year: matchedCandidate ? matchedCandidate.year : null,
        publisher: matchedCandidate && matchedCandidate.publisher ? matchedCandidate.publisher : [],
        isbn: matchedCandidate && matchedCandidate.isbn ? matchedCandidate.isbn : [],
        cover_i: matchedCandidate ? matchedCandidate.cover_i : null,
        openLibraryKey: matchedCandidate ? matchedCandidate.key : null
      };
      bookRecognitionCache.set(cacheKey, clean);
      return clean;
    } catch (err) {
      console.warn(err);
      return { title: "AI recognition error", author: "", confidence: 0, candidateIndex: -1, error: true };
    }
  }

  function formatDuration(seconds) {
    seconds = Math.max(0, Math.round(Number(seconds) || 0));
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function normalizeBookField(value) {
    const s = String(value == null ? "" : value).trim();
    if (!s) return "";
    if (/^(unknown|null|none|n\/a|undefined|untitled|unidentified(?: book)?|unknown title)$/i.test(s)) return "";
    return s;
  }

  function normalizedBookText(value) {
    return normalizeBookField(value)
      .toLowerCase()
      .replace(/&/g, " and ")
      .replace(/[^a-z0-9]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function meaningfulTitleTokens(title) {
    const stop = new Set(["a","an","the","of","and","or","to","in","on","for","by"]);
    return normalizedBookText(title)
      .split(" ")
      .filter(t => t && !stop.has(t));
  }

  function entryConfidence(entry) {
    const n = Number(entry && entry.result && entry.result.confidence);
    return Number.isFinite(n) ? Math.max(0, Math.min(1, n)) : 0;
  }

  function entryHasMetadata(entry) {
    const r = entry && entry.result;
    if (!r) return false;
    return Boolean(
      r.openLibraryKey ||
      r.cover_i ||
      (Array.isArray(r.isbn) && r.isbn.length) ||
      r.year ||
      (Array.isArray(r.publisher) && r.publisher.length)
    );
  }


  function normalizedEvidence(entry) {
    const raw = entry && entry.result && entry.result.visualEvidence;
    return Array.isArray(raw) ? raw.map(v => String(v == null ? "" : v).trim()).filter(Boolean) : [];
  }

  function titleHasVisualEvidence(entry) {
    const title = normalizeBookField(entry && entry.result && entry.result.title);
    if (!title) return false;
    const titleTokens = meaningfulTitleTokens(title);
    if (!titleTokens.length) return false;
    const evidence = normalizedEvidence(entry).map(normalizedBookText).filter(Boolean);
    if (!evidence.length) return false;
    const evidenceText = evidence.join(" ");
    const matched = titleTokens.filter(t => t.length >= 3 && evidenceText.includes(t));
    return titleTokens.length <= 2
      ? matched.length >= 1
      : matched.length >= 2 || matched.length / titleTokens.length >= 0.5;
  }

  function credibilityScore(entry) {
    if (!entry || !entry.result) return -99;
    const title = normalizeBookField(entry.result.title);
    const author = normalizeBookField(entry.result.author);
    const nt = normalizedBookText(title);
    const na = normalizedBookText(author);
    const tokens = meaningfulTitleTokens(title);
    const confidence = entryConfidence(entry);
    const hasEvidence = titleHasVisualEvidence(entry);

    if (!title) return -99;
    if (["the","a","an","nine"].includes(nt)) return -8;

    let score = 0;
    if (tokens.length >= 3) score += 3;
    else if (tokens.length === 2) score += 2.5;
    else if (tokens.length === 1 && tokens[0].length >= 5) score += 1.5;
    else score -= 1.5;

    if (author) score += 1.0;
    if (author && nt && nt === na) score -= 4;
    if (confidence >= 0.80) score += 1.25;
    else if (confidence >= 0.65) score += 0.75;
    else if (confidence >= 0.50) score += 0.25;
    else if (confidence < 0.35) score -= 1.0;
    if (entryHasMetadata(entry)) score += 0.75;

    // v25: no visually supported title, no verified book.
    if (hasEvidence) score += 4;
    else score -= 4;
    return score;
  }

  function bboxVerticalOverlap(a, b) {
    if (!a || !b) return 0;
    const overlap = Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
    const minH = Math.max(1, Math.min(a.y1 - a.y0, b.y1 - b.y0));
    return overlap / minH;
  }

  function samePhysicalBookDiagnostic(a, b) {
    if (!a || !b || !a.match || !b.match || !a.match.bbox || !b.match.bbox) return false;

    const A = a.match.bbox;
    const B = b.match.bbox;
    const iou = bboxIoU(A, B);
    if (iou >= 0.58) return true;

    const ac = bboxCenter(A);
    const bc = bboxCenter(B);
    const aw = Math.max(1, A.x1 - A.x0);
    const bw = Math.max(1, B.x1 - B.x0);
    const ah = Math.max(1, A.y1 - A.y0);
    const bh = Math.max(1, B.y1 - B.y0);

    const closeX = Math.abs(ac.x - bc.x) <= Math.max(5, Math.min(aw, bw) * 0.24);
    const closeY = Math.abs(ac.y - bc.y) <= Math.max(12, Math.min(ah, bh) * 0.12);
    const strongVerticalOverlap = bboxVerticalOverlap(A, B) >= 0.84;

    return closeX && closeY && strongVerticalOverlap;
  }

  function catalogEntryVisualPosition(entry) {
    const b = entry && entry.match && entry.match.bbox;
    if (!b) return { x: 0, y: 0 };
    return {
      x: (Number(b.x0 || 0) + Number(b.x1 || 0)) / 2,
      y: (Number(b.y0 || 0) + Number(b.y1 || 0)) / 2
    };
  }

  function visualBookSort(a, b) {
    const pa = catalogEntryVisualPosition(a);
    const pb = catalogEntryVisualPosition(b);
    const rowThreshold = sourceCanvas ? sourceCanvas.height * 0.06 : 80;
    if (Math.abs(pa.y - pb.y) > rowThreshold) return pa.y - pb.y;
    return pa.x - pb.x;
  }


  function sameCanonicalDetectedSpine(a, b) {
    if (!a || !b || !a.bbox || !b.bbox) return false;
    const A = a.bbox, B = b.bbox;
    const iou = bboxIoU(A, B);

    // v28: detected spines are the unit of truth. Only collapse detector
    // boxes when they are virtually the same geometric detection.
    if (iou >= 0.82) return true;

    const ac = bboxCenter(A), bc = bboxCenter(B);
    const aw = Math.max(1, A.x1-A.x0), bw = Math.max(1, B.x1-B.x0);
    const ah = Math.max(1, A.y1-A.y0), bh = Math.max(1, B.y1-B.y0);
    const centerX = Math.abs(ac.x-bc.x) / Math.max(aw,bw);
    const centerY = Math.abs(ac.y-bc.y) / Math.max(ah,bh);
    const widthRatio = Math.min(aw,bw) / Math.max(aw,bw);
    const heightRatio = Math.min(ah,bh) / Math.max(ah,bh);

    return centerX <= 0.10 &&
           centerY <= 0.05 &&
           widthRatio >= 0.84 &&
           heightRatio >= 0.90 &&
           bboxVerticalOverlap(A,B) >= 0.94;
  }

  function canonicalizeDetectedSpines(spines) {
    const groups = [];
    for (const spine of (spines || [])) {
      if (!spine || !spine.bbox) continue;
      let group = groups.find(g =>
        g.members.some(existing => sameCanonicalDetectedSpine(existing, spine))
      );
      if (!group) {
        group = { members: [], spine: null };
        groups.push(group);
      }
      group.members.push(spine);
      group.spine = group.members
        .slice()
        .sort((a,b) => (b.confidence||0)-(a.confidence||0))[0];
    }
    return groups.map((g,index) => ({
      ...g.spine,
      canonicalIndex:index,
      members:g.members
    }));
  }

  function bestSpineForEntryFromList(entry, spineList) {
    const b = entry && entry.match && entry.match.bbox;
    if (!b || !spineList || !spineList.length) return null;

    const ec = bboxCenter(b);
    let best = null, bestScore = -Infinity;

    for (let i=0; i<spineList.length; i++) {
      const spine = spineList[i];
      if (!spine || !spine.bbox) continue;

      const sb = spine.bbox;
      const sc = bboxCenter(sb);
      const iou = bboxIoU(b, sb);
      const vo = bboxVerticalOverlap(b, sb);
      const sw = Math.max(1, sb.x1-sb.x0);
      const sh = Math.max(1, sb.y1-sb.y0);
      const dx = Math.abs(ec.x-sc.x)/sw;
      const dy = Math.abs(ec.y-sc.y)/sh;

      // Strongly reward real overlap and same-center geometry.
      const score = iou*12 + vo*3.5 - dx*3.0 - dy*1.6;
      if (score > bestScore) {
        bestScore = score;
        best = {spine,index:i,score,iou,vo,dx,dy};
      }
    }

    if (!best) return null;

    // v28: never force a loose broad-region read onto the nearest detected
    // spine. If geometry is not convincing, leave it unassigned and let it
    // survive as an independent candidate rather than erasing a neighboring book.
    const strongOverlap = best.iou >= 0.16 && best.vo >= 0.62;
    const strongCenter = best.dx <= 0.48 && best.dy <= 0.22 && best.vo >= 0.78;
    if (!strongOverlap && !strongCenter) return null;

    return best;
  }

  function titleTokenSimilarity(a, b) {
    const A = new Set(meaningfulTitleTokens(a));
    const B = new Set(meaningfulTitleTokens(b));
    if (!A.size || !B.size) return 0;
    let inter=0;
    for (const t of A) if (B.has(t)) inter++;
    return inter / Math.max(A.size, B.size);
  }

  function sameVerifiedPhysicalBook(a, b) {
    if (!a || !b || !a.match || !b.match) return false;
    const sim = titleTokenSimilarity(a.result && a.result.title, b.result && b.result.title);
    if (sim < 0.72) return false;
    const A=a.match.bbox, B=b.match.bbox;
    if (bboxIoU(A,B) >= 0.30) return true;
    const ac=bboxCenter(A), bc=bboxCenter(B);
    const aw=Math.max(1,A.x1-A.x0), bw=Math.max(1,B.x1-B.x0);
    const ah=Math.max(1,A.y1-A.y0), bh=Math.max(1,B.y1-B.y0);
    const xClose=Math.abs(ac.x-bc.x) <= Math.max(8, Math.max(aw,bw)*0.72);
    const yClose=Math.abs(ac.y-bc.y) <= Math.max(12, Math.min(ah,bh)*0.12);
    return xClose && yClose && bboxVerticalOverlap(A,B) >= 0.70;
  }

  function bestDetectedSpineForEntry(entry) {
    const b = entry && entry.match && entry.match.bbox;
    if (!b || !diagnosticDetectedSpines.length) return null;
    const ec = bboxCenter(b);
    let best = null;
    let bestScore = -Infinity;
    for (let i = 0; i < diagnosticDetectedSpines.length; i++) {
      const spine = diagnosticDetectedSpines[i];
      if (!spine || !spine.bbox) continue;
      const sb = spine.bbox;
      const sc = bboxCenter(sb);
      const iou = bboxIoU(b, sb);
      const vo = bboxVerticalOverlap(b, sb);
      const sw = Math.max(1, sb.x1 - sb.x0);
      const sh = Math.max(1, sb.y1 - sb.y0);
      const dx = Math.abs(ec.x - sc.x) / sw;
      const dy = Math.abs(ec.y - sc.y) / sh;
      // Prefer actual overlap, but allow a nearby read whose box was slightly loose.
      const score = iou * 8 + vo * 2.5 - dx * 1.6 - dy * 0.8;
      if (score > bestScore) { bestScore = score; best = { spine, index: i, score, iou, vo, dx, dy }; }
    }
    if (!best) return null;
    if (best.iou < 0.05 && (best.dx > 1.35 || best.dy > 0.55)) return null;
    return best;
  }

  function reconcileCluster(cluster) {
    const ranked = cluster.slice().sort((a, b) => {
      const ae = titleHasVisualEvidence(a) ? 1 : 0;
      const be = titleHasVisualEvidence(b) ? 1 : 0;
      if (ae !== be) return be - ae;
      const scoreDiff = credibilityScore(b) - credibilityScore(a);
      if (Math.abs(scoreDiff) > 0.01) return scoreDiff;
      return entryConfidence(b) - entryConfidence(a);
    });

    // v26: choose the best visually supported reading for this physical spine.
    // Earlier weak reads remain diagnostic evidence but cannot create extra books.
    const supported = ranked.filter(titleHasVisualEvidence);
    const best = supported[0] || ranked[0];
    return { best, ranked };
  }


  function isStrongProvisionalTitle(entry) {
    if (!entry || !entry.result) return false;
    const title = normalizeBookField(entry.result.title);
    const author = normalizeBookField(entry.result.author);
    if (!title) return false;

    const nt = normalizedBookText(title);
    const na = normalizedBookText(author);
    if (!nt || (na && nt === na)) return false;
    if (/^(unknown|unidentified|book|novel|the|a|an)$/i.test(nt)) return false;

    const tokens = meaningfulTitleTokens(title);
    const confidence = entryConfidence(entry);

    // Broad-region reads can lack visualEvidence even when they were good.
    // Retain only unusually strong, title-like reads as provisional candidates.
    return confidence >= 0.90 &&
           (tokens.length >= 2 || (tokens.length === 1 && tokens[0].length >= 7));
  }

  function getCatalogDiagnostics() {
    const raw = diagnosticRawEntries
      .filter(e => e && e.result && e.match && e.match.bbox)
      .slice();

    const canonicalSpines = canonicalizeDetectedSpines(diagnosticDetectedSpines);

    // Every detected spine gets its own slot.
    const slots = canonicalSpines.map((spine,index) => ({
      spine,
      index,
      reads: []
    }));

    const unassignedClusters = [];

    for (const entry of raw) {
      const assignment = bestSpineForEntryFromList(entry, canonicalSpines);

      if (assignment) {
        slots[assignment.index].reads.push(entry);
      } else {
        // Do not throw away a plausible read just because the detector missed
        // or poorly localized that physical spine.
        let cluster = unassignedClusters.find(c =>
          c.some(existing => samePhysicalBookDiagnostic(existing, entry))
        );
        if (!cluster) {
          cluster = [];
          unassignedClusters.push(cluster);
        }
        cluster.push(entry);
      }
    }

    const credible = [];
    const provisional = [];
    const rejected = [];
    const duplicates = [];
    let unidentifiedSpines = 0;

    // Resolve each physical detector slot independently.
    for (const slot of slots) {
      if (!slot.reads.length) {
        unidentifiedSpines++;
        continue;
      }

      const {best, ranked} = reconcileCluster(slot.reads);
      const title = normalizeBookField(best && best.result && best.result.title);
      const verified = title && titleHasVisualEvidence(best);
      const score = credibilityScore(best);

      if (verified && score >= 2.5) {
        credible.push(best);
      } else if (title && isStrongProvisionalTitle(best)) {
        provisional.push(best);
      } else {
        rejected.push({
          entry: best,
          reason: title ? "unverified-title" : "unidentified-spine",
          score
        });
      }

      for (const entry of ranked) {
        if (entry === best) continue;
        duplicates.push({
          entry,
          reason: "alternate-read-same-spine",
          score: credibilityScore(entry)
        });
      }
    }

    // Reads that could not be confidently assigned to any detector slot may
    // represent spines the detector missed. Preserve good ones independently.
    for (const cluster of unassignedClusters) {
      const {best, ranked} = reconcileCluster(cluster);
      const title = normalizeBookField(best && best.result && best.result.title);
      const verified = title && titleHasVisualEvidence(best);
      const score = credibilityScore(best);

      if (verified && score >= 2.5) {
        credible.push(best);
      } else if (title && isStrongProvisionalTitle(best)) {
        provisional.push(best);
      } else {
        rejected.push({
          entry: best,
          reason: title ? "unassigned-unverified" : "unassigned-unidentified",
          score
        });
      }

      for (const entry of ranked) {
        if (entry === best) continue;
        duplicates.push({
          entry,
          reason: "alternate-unassigned-read",
          score: credibilityScore(entry)
        });
      }
    }

    // v28 deliberately does NOT merge two separate detector slots just because
    // their titles/authors are similar. Separate physical locations stay separate.
    credible.sort(visualBookSort);
    provisional.sort(visualBookSort);

    return {
      credible,
      provisional,
      catalog: [...credible, ...provisional].sort(visualBookSort),
      rejected,
      duplicates,
      rawCount: raw.length,
      spineCount: canonicalSpines.length,
      rawSpineCount: diagnosticDetectedSpines.length,
      unidentifiedSpines
    };
  }

  function updateCatalogStats(elapsedSeconds) {
    diagnosticLastElapsed = elapsedSeconds;
    const d = getCatalogDiagnostics();
    const label =
      `${d.credible.length} verified · ${d.provisional.length} candidates · ${d.spineCount} spines · ${formatDuration(elapsedSeconds)}`;

    if (catalogStats) {
      catalogStats.textContent = label;
      catalogStats.classList.add("visible");
    }
    if (searchCatalogStats) {
      searchCatalogStats.textContent = label;
      searchCatalogStats.classList.add("visible");
    }
  }

  function buildCopiedOCRData() {
    const words = (ocrWords || []).filter(w => w && w.text);
    const byPass = { "0°": 0, "90°": 0, "-90°": 0, "other": 0 };
    for (const w of words) {
      const key = Object.prototype.hasOwnProperty.call(byPass, w.ocrPass) ? w.ocrPass : "other";
      byPass[key]++;
    }

    const uniqueTerms = Array.isArray(termList) ? termList.length : 0;
    const avgConfidence = words.length
      ? words.reduce((sum, w) => sum + (Number.isFinite(Number(w.confidence)) ? Number(w.confidence) : 0), 0) / words.length
      : 0;

    const ordered = words.slice().sort((a, b) => {
      const ay = a?.bbox?.y0 ?? a?.bbox?.top ?? 0;
      const by = b?.bbox?.y0 ?? b?.bbox?.top ?? 0;
      const ax = a?.bbox?.x0 ?? a?.bbox?.left ?? 0;
      const bx = b?.bbox?.x0 ?? b?.bbox?.left ?? 0;
      return ay - by || ax - bx;
    });

    const lines = ordered.map((w, i) => {
      const b = w.bbox || {};
      const x0 = Math.round(b.x0 ?? b.left ?? 0);
      const y0 = Math.round(b.y0 ?? b.top ?? 0);
      const x1 = Math.round(b.x1 ?? b.right ?? 0);
      const y1 = Math.round(b.y1 ?? b.bottom ?? 0);
      const conf = Number.isFinite(Number(w.confidence)) ? Math.round(Number(w.confidence)) : "–";
      return `${i + 1}. ${w.text} [${conf}%] · ${w.ocrPass || "?"} · bbox ${x0},${y0},${x1},${y1}`;
    });

    return [
      "Spineless OCR v7 diagnostic",
      `${words.length} OCR words · ${baseOCRTerms.length} OCR search terms + ${geminiRescuedTerms.length} Gemini rescued = ${uniqueTerms} total · average confidence ${Math.round(avgConfidence)}%`,
      `passes: 0° ${byPass["0°"]} · 90° ${byPass["90°"]} · -90° ${byPass["-90°"]}`,

  async function copyOCRData(sourceEl) {
    if (!ocrWords.length) {
      if (sourceEl === utilityData) {
        const oldTitle = utilityData.title;
        utilityData.title = "No OCR data yet";
        setTimeout(() => { utilityData.title = oldTitle; }, 1200);
      }
      return;
    }

    const text = buildCopiedOCRData();
    let copied = false;
    try {
      await navigator.clipboard.writeText(text);
      copied = true;
    } catch (_) {
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        copied = document.execCommand("copy");
        textarea.remove();
      } catch (_) {}
    }

    if (sourceEl === utilityData) {
      utilityData.classList.add("is-copied");
      const oldTitle = utilityData.title;
      utilityData.title = copied ? "OCR data copied" : "Could not copy OCR data";
      setTimeout(() => {
        utilityData.classList.remove("is-copied");
        utilityData.title = oldTitle;
      }, 1200);
    }
  }

  async function enrichCatalogFromOpenLibrary(runSerial) {
    const queue = bookCatalog.filter(e => e && e.result && e.result.title);
    let cursor = 0;
    const concurrency = 5;

    async function worker() {
      while (cursor < queue.length && runSerial === catalogingRunSerial) {
        const entry = queue[cursor++];
        try {
          const params = new URLSearchParams({
            title: entry.result.title,
            author: entry.result.author || "",
            fields: "key,title,author_name,first_publish_year,cover_i,isbn,publisher",
            limit: "3"
          });
          const resp = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
          if (!resp.ok) continue;
          const data = await resp.json();
          const doc = (data.docs || [])[0];
          if (!doc) continue;

          entry.result.year = doc.first_publish_year || entry.result.year || null;
          entry.result.publisher = (doc.publisher || []).slice(0, 3);
          entry.result.isbn = (doc.isbn || []).slice(0, 4);
          entry.result.cover_i = doc.cover_i || null;
          entry.result.openLibraryKey = doc.key || null;
        } catch (err) {
          console.warn("Open Library enrichment failed:", err);
        }
      }
    }

    await Promise.all(Array.from({length: Math.min(concurrency, queue.length || 1)}, () => worker()));
  }

  function makeShelfRegions() {
    if (!sourceCanvas) return [];
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const bands = 6;
    const overlap = 0.12;
    const regions = [];

    for (let i = 0; i < bands; i++) {
      const bandH = H / bands;
      const y0 = Math.max(0, i * bandH - bandH * overlap);
      const y1 = Math.min(H, (i + 1) * bandH + bandH * overlap);

      const words = ocrWords
        .filter(w => w && w.bbox)
        .filter(w => {
          const c = bboxCenter(w.bbox);
          return c.y >= y0 && c.y <= y1;
        })
        .map(w => ({
          text: normalizeToken(w.text),
          confidence: Number(w.confidence || 0),
          bbox: {
            x0: w.bbox.x0 / W,
            y0: (w.bbox.y0 - y0) / (y1 - y0),
            x1: w.bbox.x1 / W,
            y1: (w.bbox.y1 - y0) / (y1 - y0)
          }
        }))
        .filter(w => w.text && w.text.length > 1)
        .sort((a,b) => b.confidence - a.confidence)
        .slice(0, 90);

      regions.push({ index: i, x0: 0, y0, x1: W, y1, words });
    }
    return regions;
  }

  function renderRegionImage(region) {
    const cropW = region.x1 - region.x0;
    const cropH = region.y1 - region.y0;
    const canvas = document.createElement("canvas");
    const maxW = 1500;
    const scale = Math.min(1, maxW / cropW);
    canvas.width = Math.max(1, Math.round(cropW * scale));
    canvas.height = Math.max(1, Math.round(cropH * scale));
    canvas.getContext("2d").drawImage(
      sourceCanvas,
      region.x0, region.y0, cropW, cropH,
      0, 0, canvas.width, canvas.height
    );
    return canvas.toDataURL("image/jpeg", 0.84);
  }

  function regionBookToCatalogEntry(book, region) {
    if (!book || !book.title) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = book.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);

    const bbox = {
      x0: x0 * W,
      y0: region.y0 + y0 * regionH,
      x1: Math.max(x0 * W + 2, x1 * W),
      y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
    };

    return {
      match: {
        text: book.title,
        bbox,
        confidence: Math.round((Number(book.confidence) || 0) * 100)
      },
      term: extractCatalogTokens(book.title)[0] || "",
      result: {
        title: String(book.title),
        author: book.author ? String(book.author) : "",
        confidence: Number(book.confidence) || 0,
        candidateIndex: -1,
        year: book.year || null,
        publisher: book.publisher ? [String(book.publisher)] : [],
        isbn: book.isbn ? [String(book.isbn)] : [],
        cover_i: null,
        openLibraryKey: null
      }
    };
  }

  function regionSpineToGlobal(spine, region) {
    if (!spine || !spine.bbox) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = spine.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);
    if (x1 <= x0 || y1 <= y0) return null;
    return {
      confidence: Number(spine.confidence) || 0,
      bbox: {
        x0: x0 * W,
        y0: region.y0 + y0 * regionH,
        x1: Math.max(x0 * W + 2, x1 * W),
        y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
      }
    };
  }

  function regionWordToGlobal(word, region) {
    if (!word || !word.text || !word.bbox) return null;
    const W = sourceCanvas.width;
    const regionH = region.y1 - region.y0;
    const rb = word.bbox || {};
    const clamp = n => Math.max(0, Math.min(1, Number(n) || 0));
    const x0 = clamp(rb.x0), y0 = clamp(rb.y0), x1 = clamp(rb.x1), y1 = clamp(rb.y1);
    const token = normalizeToken(word.text);
    if (!token || token.length < 2) return null;

    return {
      text: token,
      rawText: String(word.text),
      confidence: Math.round((Number(word.confidence) || 0) * 100),
      source: "ai-spine",
      bbox: {
        x0: x0 * W,
        y0: region.y0 + y0 * regionH,
        x1: Math.max(x0 * W + 2, x1 * W),
        y1: Math.max(region.y0 + y0 * regionH + 2, region.y0 + y1 * regionH)
      }
    };
  }

  function sameAIWord(a, b) {
    if (!a || !b || normalizeToken(a.text) !== normalizeToken(b.text)) return false;
    const A = bboxCenter(a.bbox), B = bboxCenter(b.bbox);
    return Math.hypot(A.x - B.x, A.y - B.y) < Math.max(35, sourceCanvas.width * 0.035);
  }

  function bboxIoU(a, b) {
    const ix0 = Math.max(a.x0, b.x0), iy0 = Math.max(a.y0, b.y0);
    const ix1 = Math.min(a.x1, b.x1), iy1 = Math.min(a.y1, b.y1);
    const iw = Math.max(0, ix1 - ix0), ih = Math.max(0, iy1 - iy0);
    const inter = iw * ih;
    const aa = Math.max(1, (a.x1-a.x0)*(a.y1-a.y0));
    const ba = Math.max(1, (b.x1-b.x0)*(b.y1-b.y0));
    return inter / Math.max(1, aa + ba - inter);
  }

  function sameDetectedSpine(a, b) {
    if (!a || !b) return false;
    const A = bboxCenter(a.bbox), B = bboxCenter(b.bbox);
    const aw = a.bbox.x1-a.bbox.x0, bw = b.bbox.x1-b.bbox.x0;
    const ah = a.bbox.y1-a.bbox.y0, bh = b.bbox.y1-b.bbox.y0;
    const centerDist = Math.hypot(A.x-B.x, A.y-B.y);
    return bboxIoU(a.bbox,b.bbox) > 0.42 ||
      (centerDist < Math.max(18, Math.min(aw,bw)*0.55) && Math.abs(ah-bh) < Math.max(60, Math.max(ah,bh)*0.45));
  }

  function renderSpineCrop(spine) {
    const b = spine.bbox;
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const bw = b.x1-b.x0, bh = b.y1-b.y0;
    const padX = Math.max(8, bw * 0.28);
    const padY = Math.max(8, bh * 0.05);
    const x0 = Math.max(0, b.x0-padX), y0 = Math.max(0, b.y0-padY);
    const x1 = Math.min(W, b.x1+padX), y1 = Math.min(H, b.y1+padY);
    const cropW = x1-x0, cropH = y1-y0;
    const canvas = document.createElement("canvas");
    const maxDim = 900;
    const scale = Math.min(1.5, maxDim / Math.max(cropW,cropH));
    canvas.width = Math.max(1, Math.round(cropW*scale));
    canvas.height = Math.max(1, Math.round(cropH*scale));
    canvas.getContext("2d").drawImage(sourceCanvas, x0,y0,cropW,cropH, 0,0,canvas.width,canvas.height);
    return canvas.toDataURL("image/jpeg", 0.9);
  }

  function ocrHintsForSpine(spine) {
    const b = spine.bbox;
    const pad = Math.max(12, (b.x1-b.x0)*0.35);
    return ocrWords
      .filter(w => w && w.bbox)
      .filter(w => {
        const c = bboxCenter(w.bbox);
        return c.x >= b.x0-pad && c.x <= b.x1+pad && c.y >= b.y0-20 && c.y <= b.y1+20;
      })
      .sort((a,b) => Number(b.confidence||0)-Number(a.confidence||0))
      .slice(0,20)
      .map(w => String(w.text||"").trim())
      .filter(Boolean);
  }

  function spineResultToCatalogEntry(spine, result) {
    if (!result || !result.title || result.title === "Unknown title") return null;
    return {
      match: {
        text: result.title,
        bbox: spine.bbox,
        confidence: Math.round((Number(result.confidence)||0)*100)
      },
      term: extractCatalogTokens(result.title)[0] || "",
      result: {
        title: String(result.title),
        author: result.author ? String(result.author) : "",
        confidence: Number(result.confidence)||0,
        candidateIndex: -1,
        year: null,
        publisher: [],
        isbn: [],
        cover_i: null,
        openLibraryKey: null
      }
    };
  }

  function sameCatalogBook(a, b) {
    if (!a || !b || !a.result || !b.result) return false;
    const at = normalizeToken(a.result.title), bt = normalizeToken(b.result.title);
    if (!at || at !== bt) return false;
    const A = bboxCenter(a.match.bbox), B = bboxCenter(b.match.bbox);
    return Math.hypot(A.x - B.x, A.y - B.y) < Math.max(100, sourceCanvas.width * 0.12);
  }

  async function identifyShelfRegion(region, runSerial, scanPass = 1) {
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "region",
        image: renderRegionImage(region),
        regionIndex: region.index,
        scanPass,
        ocrWords: region.words
      })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Region identification failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return { books: [], words: [] };
    return {
      books: (Array.isArray(data.books) ? data.books : [])
        .map(book => regionBookToCatalogEntry(book, region))
        .filter(Boolean),
      words: (Array.isArray(data.visibleWords) ? data.visibleWords : [])
        .map(word => regionWordToGlobal(word, region))
        .filter(Boolean)
    };
  }


  function spineCoveredByCatalog(spine) {
    if (!spine || !spine.bbox) return false;
    const sc = bboxCenter(spine.bbox);
    for (const entry of bookCatalog) {
      if (!entry || !entry.match || !entry.match.bbox) continue;
      const b = entry.match.bbox;
      const padX = Math.max(8, (b.x1 - b.x0) * 0.18);
      const padY = Math.max(8, (b.y1 - b.y0) * 0.08);
      const inside =
        sc.x >= b.x0 - padX && sc.x <= b.x1 + padX &&
        sc.y >= b.y0 - padY && sc.y <= b.y1 + padY;
      if (inside || bboxIoU(spine.bbox, b) > 0.22) return true;
    }
    return false;
  }

  async function detectShelfRegion(region, runSerial) {
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "detect-region",
        image: renderRegionImage(region),
        regionIndex: region.index,
        ocrWords: region.words
      })
    });
    if (!resp.ok) {
      let detail = "";
      try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Spine detection failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return { spines: [], words: [] };
    return {
      spines: (Array.isArray(data.spines) ? data.spines : []).map(s => regionSpineToGlobal(s,region)).filter(Boolean),
      words: (Array.isArray(data.visibleWords) ? data.visibleWords : []).map(w => regionWordToGlobal(w,region)).filter(Boolean)
    };
  }

  function expandedSalvageCrop(spine) {
    if (!sourceCanvas || !spine || !spine.bbox) return null;
    const W = sourceCanvas.width, H = sourceCanvas.height;
    const b = spine.bbox;
    const bw = Math.max(8, b.x1 - b.x0);
    const bh = Math.max(24, b.y1 - b.y0);
    const padX = Math.max(bw * 1.15, W * 0.018);
    const padY = Math.max(bh * 0.08, H * 0.008);
    const x0 = Math.max(0, b.x0 - padX), x1 = Math.min(W, b.x1 + padX);
    const y0 = Math.max(0, b.y0 - padY), y1 = Math.min(H, b.y1 + padY);
    const cropW = x1 - x0, cropH = y1 - y0;
    const canvas = document.createElement("canvas");
    const maxW = 900;
    const scale = Math.min(1.6, maxW / Math.max(1, cropW));
    canvas.width = Math.max(1, Math.round(cropW * scale));
    canvas.height = Math.max(1, Math.round(cropH * scale));
    canvas.getContext("2d").drawImage(sourceCanvas, x0, y0, cropW, cropH, 0, 0, canvas.width, canvas.height);
    return {
      image: canvas.toDataURL("image/jpeg", 0.92),
      targetBBox: {
        x0: (b.x0 - x0) / cropW, y0: (b.y0 - y0) / cropH,
        x1: (b.x1 - x0) / cropW, y1: (b.y1 - y0) / cropH
      }
    };
  }

  function nearbyOCRForSpine(spine, limit = 18) {
    if (!spine || !spine.bbox) return [];
    const b = spine.bbox, cx = (b.x0+b.x1)/2, cy = (b.y0+b.y1)/2;
    const rx = Math.max(60, (b.x1-b.x0)*2.5), ry = Math.max(90, (b.y1-b.y0)*0.45);
    return ocrWords.filter(w => w && w.bbox).map(w => {
      const c = bboxCenter(w.bbox);
      return { w, score: Math.abs(c.x-cx)/rx + Math.abs(c.y-cy)/ry };
    }).filter(x => x.score <= 2.2).sort((a,b)=>a.score-b.score).slice(0,limit)
      .map(x => ({ text: String(x.w.text||"").trim(), confidence: Number(x.w.confidence||0) }))
      .filter(x => x.text);
  }

  async function identifySalvageBatch(batch, runSerial) {
    const items = batch.map(spine => {
      const crop = expandedSalvageCrop(spine);
      return { id: spine.id, image: crop ? crop.image : renderSpineImage(spine),
        targetBBox: crop ? crop.targetBBox : {x0:0,y0:0,x1:1,y1:1},
        nearbyOCR: nearbyOCRForSpine(spine) };
    });
    const resp = await fetch(BOOK_ID_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: "salvage-batch", items })
    });
    if (!resp.ok) {
      let detail = ""; try { detail = JSON.stringify(await resp.json()); } catch (_) {}
      throw new Error(`Salvage identification failed (${resp.status}) ${detail}`);
    }
    const data = await resp.json();
    if (runSerial !== catalogingRunSerial) return [];
    return Array.isArray(data.results) ? data.results : [];
  }
